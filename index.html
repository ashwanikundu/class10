<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 10 Master Portal • Module 9 (Board Exam Strategy & Time Management Hub)</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #070b14;
    --card: #111827;
    --card-hover: #1f2937;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
    --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.3px; }
  .brand-sub { font-size: 0.78rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .medium-switch { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 999px; }
  .med-btn {
    padding: 6px 14px; border-radius: 999px; border: none;
    background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; box-shadow: 0 2px 8px rgba(251,191,36,0.4); }
  
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 16px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; display: flex; gap: 8px; align-items: center;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #ec4899, #8b5cf6); }
  
  .tip-box { background: var(--sub-box, var(--sub-bg)); border: 1px solid var(--border); padding: 14px 16px; border-radius: 12px; margin-top: 12px; }
  .tip-title { font-weight: 800; color: #f472b6; font-size: 0.95rem; margin-bottom: 4px; }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand-row">
      <div>
        <h1 class="brand-title">Class 10 Master Portal (CBSE & HBSE)</h1>
        <p class="brand-sub">Module 9: Board Exam Strategy & Time Management Hub</p>
      </div>
      <div class="top-controls">
        <div class="medium-switch">
          <button class="med-btn active" id="btnEn" onclick="setMedium('en')">English + Meanings</button>
          <button class="med-btn" id="btnHi" onclick="setMedium('hi')">Hindi Medium</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>
  Class 10 Master Portal • Module 9 (Strategy Hub) • Zero Data Loss Engine
</footer>

<script>
const SafeStore = {
  get(k, f) { try { const v = localStorage.getItem(k); return v !== null ? v : f; } catch(e){ return f; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  medium: SafeStore.get('mp_med', 'en'),
  isDark: SafeStore.get('mp_dark', '1') === '1'
};

function applyTheme() {
  document.body.classList.toggle('light', !state.isDark);
}
function toggleTheme() {
  state.isDark = !state.isDark;
  SafeStore.set('mp_dark', state.isDark ? '1' : '0');
  applyTheme();
}

function setMedium(m) {
  state.medium = m;
  SafeStore.set('mp_med', m);
  document.getElementById('btnEn').classList.toggle('active', m === 'en');
  document.getElementById('btnHi').classList.toggle('active', m === 'hi');
  render();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = `<span>🏠 All Utilities • Module 9 (Board Exam Strategy & Blueprint)</span>`;
}

const STRATEGIES = [
  {
    titleEn: "Paper Attempt Strategy (3-Hour Rule)",
    titleHi: "पेपर हल करने की रणनीति (3-घंटे का नियम)",
    descEn: "Start with 2-mark and 3-mark questions first when your mind is fresh. Leave 15 minutes at the end for revision and checking calculations.",
    descHi: "दिमाग तरोताजा होने पर सबसे पहले 2-अंक और 3-अंक वाले प्रश्न हल करें। अंत में 15 मिनट रिवीजन और कैलकुलेशन जाँच के लिए जरूर बचाएँ।"
  },
  {
    titleEn: "Presentation & Step Marking",
    titleHi: "उत्तर प्रस्तुति और स्टेप मार्किंग",
    descEn: "Always draw a neat margin on the answer sheet. Write given values, formula, substitution, and final answer with correct SI units for step marks.",
    descHi: "उत्तर पुस्तिका में हमेशा हाशिया (Margin) खींचें। स्टेप मार्किंग पाने के लिए दिया गया मान, सूत्र, मान रखना और सही मात्रक के साथ अंतिम उत्तर लिखें।"
  },
  {
    titleEn: "Diagram & Graph Precision",
    titleHi: "चित्र और ग्राफ की सटीकता",
    descEn: "Use a sharp HB pencil for all science diagrams (ray optics, biology life processes) and math constructions/graphs. Label every important part clearly.",
    descHi: "विज्ञान के चित्रों (किरण आरेख, जैव प्रक्रम) और गणित की रचनाओं व ग्राफ के लिए हमेशा तेज धार वाली HB पेंसिल का उपयोग करें।"
  },
  {
    titleEn: "Handling Difficult Numerical Questions",
    titleHi: "कठिन न्यूमेरिकल प्रश्नों को हल करने का तरीका",
    descEn: "If stuck in a numerical, write down all known variables (Given:) and the relevant formula. Even partial steps fetch 50% marks in board exams.",
    descHi: "यदि किसी न्यूमेरिकल में अटक जाएँ, तो कम से कम 'Given:' (दिया गया है) और संबंधित सूत्र जरूर लिख आएं। बोर्ड परीक्षा में आधे नंबर मिल जाते हैं।"
  }
];

function render() {
  renderBreadcrumb();
  const app = document.getElementById('app');

  app.innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 8px; font-size:1.15rem;">🎯 CBSE & HBSE Board Exam Master Strategy (Topper Blueprint)</h2>
      <p style="margin:0 0 14px; font-size:0.85rem; color:var(--muted);">बोर्ड परीक्षा में 80/80 अंक पक्के करने के लिए अचूक समय प्रबंधन और परीक्षा हॉल टिप्स।</p>
      
      ${STRATEGIES.map(s => `
        <div class="tip-box">
          <div class="tip-title">📌 ${state.medium === 'hi' ? s.titleHi : s.titleEn}</div>
          <div style="font-size:0.88rem; color:var(--text); margin-top:4px;">${state.medium === 'hi' ? s.descHi : s.descEn}</div>
        </div>
      `).join('')}
    </div>
  `;
}

applyTheme();
render();
</script>
</body>
</html>
