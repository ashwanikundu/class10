<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 10 Master Portal • Module 11 (Interactive Progress Tracker & Milestone Hub)</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #070b14;
    --card: #111827;
    --card-hover: #1f2937;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
    --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.3px; }
  .brand-sub { font-size: 0.78rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .medium-switch { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 999px; }
  .med-btn {
    padding: 6px 14px; border-radius: 999px; border: none;
    background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; box-shadow: 0 2px 8px rgba(251,191,36,0.4); }
  
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 16px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; display: flex; gap: 8px; align-items: center;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #f59e0b, #10b981); }
  
  .btn {
    background: linear-gradient(135deg, #f59e0b, #d97706); color: #090d16; border: none;
    padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem;
  }
  
  .check-item { display: flex; align-items: center; gap: 12px; background: var(--sub-bg); border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px; margin-top: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  .check-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #fbbf24; cursor: pointer; }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand-row">
      <div>
        <h1 class="brand-title">Class 10 Master Portal (CBSE & HBSE)</h1>
        <p class="brand-sub">Module 11: Interactive Progress Tracker & Milestone Hub</p>
      </div>
      <div class="top-controls">
        <div class="medium-switch">
          <button class="med-btn active" id="btnEn" onclick="setMedium('en')">English + Meanings</button>
          <button class="med-btn" id="btnHi" onclick="setMedium('hi')">Hindi Medium</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>
  Class 10 Master Portal • Module 11 (Progress Hub) • Zero Data Loss Engine
</footer>

<script>
const SafeStore = {
  get(k, f) { try { const v = localStorage.getItem(k); return v !== null ? v : f; } catch(e){ return f; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  medium: SafeStore.get('mp_med', 'en'),
  isDark: SafeStore.get('mp_dark', '1') === '1',
  progress: JSON.parse(SafeStore.get('mp_prog', '{}'))
};

const MODULES_LIST = [
  { id: 'mod1', titleEn: 'Module 1: Core Architecture & Navigation', titleHi: 'मॉड्यूल 1: कोर आर्किटेक्चर और नेविगेशन' },
  { id: 'mod2', titleEn: 'Module 2: Mathematics (All 14 Chapters)', titleHi: 'मॉड्यूल 2: गणित (सभी 14 अध्याय)' },
  { id: 'mod3', titleEn: 'Module 3: Science (All 13 Chapters)', titleHi: 'मॉड्यूल 3: विज्ञान (सभी 13 अध्याय)' },
  { id: 'mod4', titleEn: 'Module 4: AI Utilities & Voice Assistant', titleHi: 'मॉड्यूल 4: एआई स्कैनर और वॉइस असिस्टेंट' },
  { id: 'mod5', titleEn: 'Module 5: PDF Generator & Heatmap', titleHi: 'मॉड्यूल 5: पीडीएफ जनरेटर और हीटमैट' },
  { id: 'mod6', titleEn: 'Module 6: Diagnostics & Cache Manager', titleHi: 'मॉड्यूल 6: डायग्नोस्टिक्स और कैशे मैनेजर' },
  { id: 'mod7', titleEn: 'Module 7: Interactive Self-Assessment Quiz', titleHi: 'मॉड्यूल 7: इंटरैक्टिव क्विज़ इंजन' },
  { id: 'mod8', titleEn: 'Module 8: Formula & Theorem Bank', titleHi: 'मॉड्यूल 8: फॉर्मूला और थ्योरम बैंक' },
  { id: 'mod9', titleEn: 'Module 9: Board Exam Strategy Hub', titleHi: 'मॉड्यूल 9: बोर्ड परीक्षा रणनीति हब' },
  { id: 'mod10', titleEn: 'Module 10: Formula Practice Hub', titleHi: 'मॉड्यूल 10: फॉर्मूला प्रैक्टिस हब' },
  { id: 'mod11', titleEn: 'Module 11: Progress Tracker & Milestones', titleHi: 'मॉड्यूल 11: प्रगति ट्रैकर और माइलस्टोन' }
];

function applyTheme() {
  document.body.classList.toggle('light', !state.isDark);
}
function toggleTheme() {
  state.isDark = !state.isDark;
  SafeStore.set('mp_dark', state.isDark ? '1' : '0');
  applyTheme();
}

function setMedium(m) {
  state.medium = m;
  SafeStore.set('mp_med', m);
  document.getElementById('btnEn').classList.toggle('active', m === 'en');
  document.getElementById('btnHi').classList.toggle('active', m === 'hi');
  render();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = `<span>🏠 All Utilities • Module 11 (Interactive Progress Tracker)</span>`;
}

function render() {
  renderBreadcrumb();
  const app = document.getElementById('app');

  const completedCount = MODULES_LIST.filter(m => state.progress[m.id]).length;
  const percent = Math.round((completedCount / MODULES_LIST.length) * 100);

  app.innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 8px; font-size:1.15rem;">📈 Portal Completion Progress Tracker</h2>
      <p style="margin:0 0 14px; font-size:0.85rem; color:var(--muted);">पोर्टल के मॉड्यूल्स की प्रगति को ट्रैक करें और अपनी तैयारी का आकलन करें।</p>
      
      <div style="background:var(--sub-bg); border:1px solid var(--border); padding:14px; border-radius:12px; margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.9rem; margin-bottom:6px;">
          <span>Overall Progress:</span>
          <span style="color:#34d399;">${percent}% Completed (${completedCount}/${MODULES_LIST.length} Modules)</span>
        </div>
        <div style="width:100%; height:10px; background:var(--border); border-radius:999px; overflow:hidden;">
          <div style="width:${percent}%; height:100%; background:linear-gradient(90deg, #f59e0b, #10b981); transition: width 0.3s ease;"></div>
        </div>
      </div>

      <div>
        ${MODULES_LIST.map(m => `
          <label class="check-item">
            <input type="checkbox" ${state.progress[m.id] ? 'checked' : ''} onchange="toggleProgress('${m.id}')">
            <span>${state.medium === 'hi' ? m.titleHi : m.titleEn}</span>
          </label>
        `).join('')}
      </div>
    </div>
  `;
}

function toggleProgress(id) {
  state.progress[id] = !state.progress[id];
  SafeStore.set('mp_prog', JSON.stringify(state.progress));
  render();
}

applyTheme();
render();
</script>
</body>
</html>
