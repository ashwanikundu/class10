<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 10 Master Portal • Module 1 (Core Engine)</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #070b14;
    --card: #111827;
    --card-hover: #1f2937;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
    --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.3px; }
  .brand-sub { font-size: 0.78rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .medium-switch { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 999px; }
  .med-btn {
    padding: 6px 14px; border-radius: 999px; border: none;
    background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; box-shadow: 0 2px 8px rgba(251,191,36,0.4); }
  
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 16px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; display: flex; gap: 8px; align-items: center;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .crumb-link { color: var(--primary); cursor: pointer; text-decoration: underline; }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #10b981, #4f46e5); }
  
  .subj-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; background: #dbeafe; color: #1e40af; margin-bottom: 8px; }
  .subj-badge.sci { background: #dcfce7; color: #166534; }
  
  .btn-open { display: inline-block; margin-top: 14px; font-weight: 800; color: var(--primary); font-size: 0.88rem; cursor: pointer; }
  .btn-open:hover { text-decoration: underline; }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand-row">
      <div>
        <h1 class="brand-title">Class 10 Master Portal (CBSE & HBSE)</h1>
        <p class="brand-sub">Modular Architecture • Module 1: Core Base Engine & Subject Switcher</p>
      </div>
      <div class="top-controls">
        <div class="medium-switch">
          <button class="med-btn active" id="btnEn" onclick="setMedium('en')">English + Meanings</button>
          <button class="med-btn" id="btnHi" onclick="setMedium('hi')">Hindi Medium</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>
  Class 10 Master Portal • Modular Technology • Zero Data Loss Engine
</footer>

<script>
const SafeStore = {
  get(k, f) { try { const v = localStorage.getItem(k); return v !== null ? v : f; } catch(e){ return f; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  medium: SafeStore.get('mp_med', 'en'),
  isDark: SafeStore.get('mp_dark', '1') === '1',
  subjectId: null
};

function applyTheme() {
  document.body.classList.toggle('light', !state.isDark);
}
function toggleTheme() {
  state.isDark = !state.isDark;
  SafeStore.set('mp_dark', state.isDark ? '1' : '0');
  applyTheme();
}

function setMedium(m) {
  state.medium = m;
  SafeStore.set('mp_med', m);
  document.getElementById('btnEn').classList.toggle('active', m === 'en');
  document.getElementById('btnHi').classList.toggle('active', m === 'hi');
  render();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!state.subjectId) {
    bc.innerHTML = `<span>🏠 All Subjects (सभी विषय) • Modular Base Engine Active</span>`;
    return;
  }
  bc.innerHTML = `<span class="crumb-link" onclick="state.subjectId=null;render();">All Subjects</span> › <span>${state.subjectId === 'math' ? 'Mathematics' : 'Science'}</span>`;
}

const MODULE_REGISTRY = [
  {
    id: 'math',
    badge: 'Subject 1 • Module 2',
    titleEn: 'Mathematics (Ganit)',
    titleHi: 'गणित (सभी 14 अध्याय - NCERT + Deepak & MBD Guide)',
    descEn: 'Complete Chapter-wise formulas, original textbook exercises, step-by-step master solutions, and Board Guess Papers.',
    descHi: 'कक्षा 10 गणित के सभी 14 पाठ: संपूर्ण सूत्र, मूल प्रश्नावलियाँ, चरणबद्ध मास्टर हल और बोर्ड परीक्षा के महत्वपूर्ण प्रश्न।'
  },
  {
    id: 'sci',
    badge: 'Subject 2 • Module 3',
    titleEn: 'Science (Vigyan)',
    titleHi: 'विज्ञान (भौतिकी, रसायन, जीव विज्ञान - संपूर्ण 13 अध्याय)',
    descEn: 'Exact serial order: Chemistry (Ch 1-4), Biology (Ch 5-8, 13) and Physics (Ch 9-12) with equations and numericals.',
    descHi: 'सटीक एनसीईआरटी क्रम: रसायन विज्ञान, जीव विज्ञान और भौतिक विज्ञान रासायनिक समीकरणों और न्यूमेरिकल के साथ।'
  }
];

function render() {
  renderBreadcrumb();
  const app = document.getElementById('app');

  if (!state.subjectId) {
    app.innerHTML = `
      <div class="card" style="margin-bottom: 20px; background: linear-gradient(135deg, rgba(79,70,229,0.15), rgba(13,148,136,0.15)); border-color: var(--primary);">
        <h2 style="margin: 0 0 8px; font-size: 1.2rem; color: var(--primary);">🚀 Modular Base Engine Active (Zero Bloat & Zero Data Loss)</h2>
        <p style="margin: 0; font-size: 0.88rem; color: var(--muted);">
          फाइल के आकार को संतुलित और सुरक्षित रखने के लिए यह <b>Module 1 (Core Architecture)</b> है। इसके बाद सब्जेक्ट मॉड्यूल्स (गणित और विज्ञान) बिना किसी कचरे के सटीक रूप से लोड किए जाएंगे।
        </p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
        ${MODULE_REGISTRY.map(s => `
          <div class="card" onclick="alert('Module for ${s.titleEn} is linked and ready to mount in the next clean update sequence.')" style="cursor:pointer; display:flex; flex-direction:column; justify-content:space-between;">
            <div>
              <span class="subj-badge ${s.id==='sci'?'sci':''}">${s.badge}</span>
              <h2 style="margin:6px 0 8px; font-size:1.15rem; font-weight:800;">${state.medium==='hi'?s.titleHi:s.titleEn}</h2>
              <p style="margin:0; font-size:0.85rem; color:var(--muted);">${state.medium==='hi'?s.descHi:s.descEn}</p>
            </div>
            <div class="btn-open">मॉड्यूल लोड करें (Load Module) →</div>
          </div>
        `).join('')}
      </div>
    `;
    return;
  }
}

applyTheme();
render();
</script>
</body>
</html>
