<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 10 Master Portal • Module 10 (Interactive Formula Practice & Test Hub)</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #070b14;
    --card: #111827;
    --card-hover: #1f2937;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
    --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.3px; }
  .brand-sub { font-size: 0.78rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .medium-switch { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 999px; }
  .med-btn {
    padding: 6px 14px; border-radius: 999px; border: none;
    background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; box-shadow: 0 2px 8px rgba(251,191,36,0.4); }
  
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 16px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; display: flex; gap: 8px; align-items: center;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #10b981, #3b82f6); }
  
  .btn {
    background: linear-gradient(135deg, #10b981, #047857); color: #fff; border: none;
    padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem;
  }
  
  .practice-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--sub-bg); color: var(--text); margin-top: 10px; font-family: inherit; }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand-row">
      <div>
        <h1 class="brand-title">Class 10 Master Portal (CBSE & HBSE)</h1>
        <p class="brand-sub">Module 10: Interactive Formula Practice & Test Hub</p>
      </div>
      <div class="top-controls">
        <div class="medium-switch">
          <button class="med-btn active" id="btnEn" onclick="setMedium('en')">English + Meanings</button>
          <button class="med-btn" id="btnHi" onclick="setMedium('hi')">Hindi Medium</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>
  Class 10 Master Portal • Module 10 (Practice Hub) • Zero Data Loss Engine
</footer>

<script>
const SafeStore = {
  get(k, f) { try { const v = localStorage.getItem(k); return v !== null ? v : f; } catch(e){ return f; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  medium: SafeStore.get('mp_med', 'en'),
  isDark: SafeStore.get('mp_dark', '1') === '1',
  qIndex: 0,
  userAnswer: '',
  feedback: ''
};

const PRACTICE_ITEMS = [
  {
    promptEn: "Type the formula for Discriminant (D) of quadratic equation:",
    promptHi: "द्विघात समीकरण के विविक्तकर (Discriminant / D) का सूत्र टाइप करें:",
    ans: "b^2 - 4ac"
  },
  {
    promptEn: "Type Ohm's Law relation between V, I and R:",
    promptHi: "V, I और R के बीच ओह्म का नियम टाइप करें:",
    ans: "ir"
  },
  {
    promptEn: "Type the formula for Sum of zeroes (α + β) for quadratic polynomial:",
    promptHi: "द्विघात बहुपद के शून्यकों के योग (α + β) का सूत्र टाइप करें:",
    ans: "-b/a"
  },
  {
    promptEn: "Type the Lens Formula (1/v - 1/u = 1/f):",
    promptHi: "लेंस सूत्र टाइप करें (1/v - 1/u = 1/f):",
    ans: "1/v - 1/u = 1/f"
  }
];

function applyTheme() {
  document.body.classList.toggle('light', !state.isDark);
}
function toggleTheme() {
  state.isDark = !state.isDark;
  SafeStore.set('mp_dark', state.isDark ? '1' : '0');
  applyTheme();
}

function setMedium(m) {
  state.medium = m;
  SafeStore.set('mp_med', m);
  document.getElementById('btnEn').classList.toggle('active', m === 'en');
  document.getElementById('btnHi').classList.toggle('active', m === 'hi');
  render();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = `<span>🏠 All Utilities • Module 10 (Interactive Formula Practice Hub)</span>`;
}

function render() {
  renderBreadcrumb();
  const app = document.getElementById('app');

  if (state.qIndex >= PRACTICE_ITEMS.length) {
    app.innerHTML = `
      <div class="card" style="text-align:center; padding:30px;">
        <h2 style="margin:0 0 10px; color:#34d399;">🌟 Formula Practice Completed!</h2>
        <p style="font-size:1.05rem; margin-bottom:16px;">आपने सभी फॉर्मूलों का अभ्यास सफलतापूर्वक पूरा कर लिया है।</p>
        <button class="btn" onclick="state.qIndex=0; state.feedback=''; render();">🔄 दोबारा अभ्यास करें (Restart Practice)</button>
      </div>
    `;
    return;
  }

  const item = PRACTICE_ITEMS[state.qIndex];

  app.innerHTML = `
    <div class="card">
      <div style="font-size:0.78rem; font-weight:700; color:var(--muted); margin-bottom:6px;">Practice Item ${state.qIndex + 1} of ${PRACTICE_ITEMS.length}</div>
      <h3 style="margin:0 0 12px; font-size:1.05rem;">${state.medium === 'hi' ? item.promptHi : item.promptEn}</h3>
      <input type="text" class="practice-input" id="ansInput" placeholder="अपना उत्तर यहाँ लिखें..." value="${state.userAnswer}" oninput="state.userAnswer=this.value">
      <button class="btn" style="margin-top:12px; width:100%; justify-content:center;" onclick="checkAnswer()">✔️ उत्तर की जाँच करें (Verify Answer)</button>
      <div id="practiceFeedback" style="margin-top:12px; font-weight:700;">${state.feedback}</div>
    </div>
  `;
}

function checkAnswer() {
  const item = PRACTICE_ITEMS[state.qIndex];
  const user = state.userAnswer.trim().toLowerCase().replace(/\s+/g, '');
  const correct = item.ans.trim().toLowerCase().replace(/\s+/g, '');

  if (user === correct) {
    state.feedback = `<span style="color:#34d399;">✅ बिल्कुल सही जवाब! (Correct Answer)</span>`;
    render();
    setTimeout(() => {
      state.qIndex++;
      state.userAnswer = '';
      state.feedback = '';
      render();
    }, 1200);
  } else {
    state.feedback = `<span style="color:#ef4444;">❌ गलत उत्तर। सही सूत्र: <b>${item.ans}</b></span>`;
    render();
  }
}

applyTheme();
render();
</script>
</body>
</html>
