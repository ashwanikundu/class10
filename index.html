<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 10 Master Portal • Module 8 (Advanced AI Formula & Theorem Reference Bank)</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #070b14;
    --card: #111827;
    --card-hover: #1f2937;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
    --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.3px; }
  .brand-sub { font-size: 0.78rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .medium-switch { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 999px; }
  .med-btn {
    padding: 6px 14px; border-radius: 999px; border: none;
    background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; box-shadow: 0 2px 8px rgba(251,191,36,0.4); }
  
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 16px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; display: flex; gap: 8px; align-items: center;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #3b82f6, #10b981); }
  
  .formula-card { background: var(--sub-bg); border: 1px solid var(--border); padding: 14px 16px; border-radius: 12px; margin-top: 10px; }
  .formula-title { font-weight: 800; color: #38bdf8; font-size: 0.95rem; margin-bottom: 4px; }
  .formula-expr { font-family: monospace; font-size: 1.05rem; color: #fbbf24; background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; display: inline-block; margin: 4px 0; }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand-row">
      <div>
        <h1 class="brand-title">Class 10 Master Portal (CBSE & HBSE)</h1>
        <p class="brand-sub">Module 8: Advanced AI Formula & Theorem Reference Bank</p>
      </div>
      <div class="top-controls">
        <div class="medium-switch">
          <button class="med-btn active" id="btnEn" onclick="setMedium('en')">English + Meanings</button>
          <button class="med-btn" id="btnHi" onclick="setMedium('hi')">Hindi Medium</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>
  Class 10 Master Portal • Module 8 (Formula Bank) • Zero Data Loss Engine
</footer>

<script>
const SafeStore = {
  get(k, f) { try { const v = localStorage.getItem(k); return v !== null ? v : f; } catch(e){ return f; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  medium: SafeStore.get('mp_med', 'en'),
  isDark: SafeStore.get('mp_dark', '1') === '1',
  activeSubj: 'math' // 'math', 'sci'
};

function applyTheme() {
  document.body.classList.toggle('light', !state.isDark);
}
function toggleTheme() {
  state.isDark = !state.isDark;
  SafeStore.set('mp_dark', state.isDark ? '1' : '0');
  applyTheme();
}

function setMedium(m) {
  state.medium = m;
  SafeStore.set('mp_med', m);
  document.getElementById('btnEn').classList.toggle('active', m === 'en');
  document.getElementById('btnHi').classList.toggle('active', m === 'hi');
  render();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = `<span>🏠 All Utilities • Module 8 (Advanced Formula & Theorem Bank)</span>`;
}

const FORMULAS = {
  math: [
    { titleEn: "Real Numbers: HCF & LCM relation", titleHi: "वास्तविक संख्याएँ: HCF और LCM संबंध", expr: "HCF(a, b) × LCM(a, b) = a × b", descEn: "Product of two positive integers equals product of their HCF and LCM.", descHi: "किन्हीं दो धनात्मक पूर्णांकों का गुणनफल उनके HCF और LCM के गुणनफल के बराबर होता है।" },
    { titleEn: "Quadratic Polynomial Zeroes", titleHi: "द्विघात बहुपद के शून्यक", expr: "α + β = -b/a , αβ = c/a", descEn: "Sum and product of zeroes for ax² + bx + c.", descHi: "द्विघात बहुपद ax² + bx + c के शून्यकों का योग और गुणनफल।" },
    { titleEn: "Quadratic Formula", titleHi: "द्विघात सूत्र (श्रीधराचार्य नियम)", expr: "x = (-b ± √(b² - 4ac)) / 2a", descEn: "Direct formula to find roots when D = b² - 4ac ≥ 0.", descHi: "मूल निकालने का सीधा सूत्र जहाँ विविक्तकर D = b² - 4ac ≥ 0 हो।" },
    { titleEn: "Arithmetic Progression (AP)", titleHi: "समांतर श्रेढ़ी (AP)", expr: "an = a + (n - 1)d , Sn = n/2[2a + (n - 1)d]", descEn: "Formula for nth term and sum of n terms of an AP.", descHi: "nवाँ पद और n पदों के योग का सूत्र।" },
    { titleEn: "Trigonometric Identities", titleHi: "त्रिकोणमितीय सर्वसमिकाएँ", expr: "sin²θ + cos²θ = 1, 1 + tan²θ = sec²θ", descEn: "Fundamental trigonometric relations for right triangles.", descHi: "समकोण त्रिभुज के लिए मूलभूत त्रिकोणमितीय संबंध।" }
  ],
  sci: [
    { titleEn: "Ohm's Law", titleHi: "ओह्म का नियम", expr: "V = IR (or I = V/R)", descEn: "Relationship between potential difference (V), current (I) and resistance (R).", descHi: "विभवांतर (V), विद्युत धारा (I) और प्रतिरोध (R) के बीच संबंध।" },
    { titleEn: "Lens Formula & Magnification", titleHi: "लेंस सूत्र और आवर्धन", expr: "1/v - 1/u = 1/f , m = h'/h = v/u", descEn: "Relates image distance, object distance and focal length for spherical lenses.", descHi: "गोलीय लेंसों के लिए प्रतिबिंब दूरी, वस्तु दूरी और फोकस दूरी में संबंध।" },
    { titleEn: "Refractive Index", titleHi: "अपवर्तनांक", expr: "n = c / v", descEn: "Ratio of speed of light in vacuum to speed in medium.", descHi: "निर्वात में प्रकाश की चाल और माध्यम में प्रकाश की चाल का अनुपात।" },
    { titleEn: "Electric Power", titleHi: "विद्युत शक्ति", expr: "P = VI = I²R = V²/R", descEn: "Rate at which electrical energy is dissipated or consumed.", descHi: "विद्युत ऊर्जा के उपभोग की दर।" }
  ]
};

function render() {
  renderBreadcrumb();
  const app = document.getElementById('app');

  const list = FORMULAS[state.activeSubj];

  app.innerHTML = `
    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <button class="btn ${state.activeSubj==='math'?'':'btn-diag'}" onclick="state.activeSubj='math';render();" style="background:${state.activeSubj==='math'?'#4f46e5':'#1e293b'}; color:#fff;">📐 Mathematics Formulas</button>
      <button class="btn ${state.activeSubj==='sci'?'':'btn-diag'}" onclick="state.activeSubj='sci';render();" style="background:${state.activeSubj==='sci'?'#10b981':'#1e293b'}; color:#fff;">🔬 Science Formulas & Laws</button>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px; font-size:1.15rem;">📚 ${state.activeSubj === 'math' ? 'Mathematics Master Formula Bank' : 'Science Laws & Formulas Bank'}</h2>
      <p style="margin:0 0 14px; font-size:0.85rem; color:var(--muted);">बोर्ड परीक्षा के अंतिम समय में रिवीजन के लिए सभी महत्वपूर्ण सूत्र और प्रमेय एक ही जगह।</p>
      
      ${list.map(f => `
        <div class="formula-card">
          <div class="formula-title">${state.medium === 'hi' ? f.titleHi : f.titleEn}</div>
          <div class="formula-expr">${f.expr}</div>
          <div style="font-size:0.82rem; color:var(--muted); margin-top:4px;">${state.medium === 'hi' ? f.descHi : f.descEn}</div>
        </div>
      `).join('')}
    </div>
  `;
}

applyTheme();
render();
</script>
</body>
</html>
