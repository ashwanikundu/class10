<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 1 to 12 Master Study Portal • HBSE & CBSE Hub</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #070b14;
    --card: #111827;
    --card-hover: #1f2937;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
    --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.3px; }
  .brand-sub { font-size: 0.78rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .medium-switch { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 999px; }
  .med-btn {
    padding: 6px 14px; border-radius: 999px; border: none;
    background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; box-shadow: 0 2px 8px rgba(251,191,36,0.4); }
  
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 1000px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 16px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; display: flex; gap: 8px; align-items: center;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .crumb-link { color: var(--primary); cursor: pointer; text-decoration: underline; }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #10b981, #4f46e5); }
  
  .grid-classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 14px; }
  .class-box { background: var(--sub-bg); border: 1px solid var(--border); padding: 16px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: 800; transition: all 0.2s; }
  .class-box:hover { border-color: var(--primary); transform: translateY(-2px); background: rgba(79,70,229,0.1); }

  .subj-box { background: var(--sub-bg); border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .subj-box:hover { border-color: #10b981; }

  .ai-chat-box { background: var(--sub-bg); border: 1px solid var(--border); padding: 14px; border-radius: 12px; margin-top: 14px; }
  .ai-input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: inherit; margin-top: 8px; }

  .btn { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand-row">
      <div>
        <h1 class="brand-title">Class 1 to 12 Master Study Portal (HBSE & CBSE)</h1>
        <p class="brand-sub">Modular Architecture • Classes 1-12 Real Lessons & Exercises + AI Tutor</p>
      </div>
      <div class="top-controls">
        <div class="medium-switch">
          <button class="med-btn active" id="btnEn" onclick="setMedium('en')">English + Meanings</button>
          <button class="med-btn" id="btnHi" onclick="setMedium('hi')">Hindi Medium</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>
  Class 1 to 12 Master Portal • HBSE & CBSE Hub • Zero Data Loss Engine
</footer>

<script>
const SafeStore = {
  get(k, f) { try { const v = localStorage.getItem(k); return v !== null ? v : f; } catch(e){ return f; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  medium: SafeStore.get('mp_med', 'en'),
  isDark: SafeStore.get('mp_dark', '1') === '1',
  view: 'home', // 'home', 'subjects', 'lessons', 'content', 'ai_tutor'
  classNum: null,
  subjectKey: null,
  lessonIdx: null,
  aiQuery: '',
  aiResponse: ''
};

function applyTheme() {
  document.body.classList.toggle('light', !state.isDark);
}
function toggleTheme() {
  state.isDark = !state.isDark;
  SafeStore.set('mp_dark', state.isDark ? '1' : '0');
  applyTheme();
}

function setMedium(m) {
  state.medium = m;
  SafeStore.set('mp_med', m);
  document.getElementById('btnEn').classList.toggle('active', m === 'en');
  document.getElementById('btnHi').classList.toggle('active', m === 'hi');
  render();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (state.view === 'home') {
    bc.innerHTML = `<span>🏠 All Classes (कक्षा 1 से 12) • HBSE & CBSE Hub</span>`;
  } else if (state.view === 'ai_tutor') {
    bc.innerHTML = `<span class="crumb-link" onclick="state.view='home';render();">Home</span> › <span>🤖 AI Tutor Assistant</span>`;
  } else if (state.view === 'subjects') {
    bc.innerHTML = `<span class="crumb-link" onclick="state.view='home';state.classNum=null;render();">All Classes</span> › <span>Class ${state.classNum} Subjects</span>`;
  } else if (state.view === 'lessons') {
    const subObj = getSyllabusData(state.classNum)[state.subjectKey];
    bc.innerHTML = `<span class="crumb-link" onclick="state.view='home';state.classNum=null;render();">All Classes</span> › <span class="crumb-link" onclick="state.view='subjects';state.subjectKey=null;render();">Class ${state.classNum}</span> › <span>${state.medium==='hi'?subObj.nameHi:subObj.nameEn}</span>`;
  } else if (state.view === 'content') {
    const subObj = getSyllabusData(state.classNum)[state.subjectKey];
    const lesson = subObj.lessons[state.lessonIdx];
    bc.innerHTML = `<span class="crumb-link" onclick="state.view='home';render();">Home</span> › <span class="crumb-link" onclick="state.view='lessons';state.lessonIdx=null;render();">${state.medium==='hi'?subObj.nameHi:subObj.nameEn}</span> › <span>${state.medium==='hi'?lesson.titleHi:lesson.titleEn}</span>`;
  }
}

// Comprehensive real syllabus mapping for Classes 1 to 12 (HBSE & CBSE)
function getSyllabusData(c) {
  if (c === 10) {
    return {
      math: {
        nameEn: "Mathematics (Ganit)", nameHi: "गणित",
        lessons: [
          { titleEn: "Ch 1: Real Numbers", titleHi: "अध्याय 1: वास्तविक संख्याएँ", descEn: "HCF, LCM, Fundamental Theorem of Arithmetic.", descHi: "अंकगणित की आधारभूत प्रमेय, HCF और LCM ज्ञात करना।", ex: "Ex 1.1 & 1.2: Find HCF and LCM of 26 and 91, Prove √5 is irrational." },
          { titleEn: "Ch 2: Polynomials", titleHi: "अध्याय 2: बहुपद", descEn: "Geometrical meaning of zeroes, relationship between zeroes and coefficients.", descHi: "बहुपद के शून्यक और गुणांकों के बीच संबंध।", ex: "Ex 2.1 & 2.2: Find zeroes of quadratic polynomial x² - 2x - 8." },
          { titleEn: "Ch 3: Pair of Linear Equations in Two Variables", titleHi: "अध्याय 3: दो चर वाले रैखिक समीकरण युग्म", descEn: "Graphical and algebraic methods (Substitution, Elimination).", descHi: "ग्राफीय और बीजगणितीय विधियाँ (प्रतिस्थापन, विलोपन)।", ex: "Ex 3.1 to 3.4: Solve equations by substitution and elimination." },
          { titleEn: "Ch 4: Quadratic Equations", titleHi: "अध्याय 4: द्विघात समीकरण", descEn: "Solution by factorization and quadratic formula.", descHi: "गुणनखंड और द्विघात सूत्र (श्रीधराचार्य नियम) द्वारा हल।", ex: "Ex 4.1 to 4.3: Find roots of 2x² - x + 3 = 0." },
          { titleEn: "Ch 5: Arithmetic Progressions", titleHi: "अध्याय 5: समांतर श्रेढ़ी (AP)", descEn: "nth term and sum of n terms of an AP.", descHi: "nवाँ पद और n पदों का योग।", ex: "Ex 5.1 to 5.3: Find 11th term of AP: -3, -1/2, 2, ..." },
          { titleEn: "Ch 6: Triangles", titleHi: "अध्याय 6: त्रिभुज", descEn: "Similarity of triangles, Thales Theorem (BPT).", descHi: "समरूप त्रिभुज और थेल्स प्रमेय (आधारभूत आनुपातिकता प्रमेय)।", ex: "Ex 6.1 to 6.5: Prove Basic Proportionality Theorem." },
          { titleEn: "Ch 7: Coordinate Geometry", titleHi: "अध्याय 7: निर्देशांक ज्यामिति", descEn: "Distance formula, section formula.", descHi: "दूरी सूत्र, विभाजन सूत्र और मध्य बिंदु।", ex: "Ex 7.1 to 7.3: Find distance between (2,3) and (4,1)." },
          { titleEn: "Ch 8: Introduction to Trigonometry", titleHi: "अध्याय 8: त्रिकोणमिति का परिचय", descEn: "Trigonometric ratios, identities.", descHi: "त्रिकोणमितीय अनुपात, तालिका और सर्वसमिकाएँ।", ex: "Ex 8.1 to 8.4: Evaluate sin 60° cos 30° + sin 30° cos 60°." },
          { titleEn: "Ch 9: Some Applications of Trigonometry", titleHi: "अध्याय 9: त्रिकोणमिति के कुछ अनुप्रयोग", descEn: "Heights and distances, angles of elevation and depression.", descHi: "ऊँचाई और दूरी, उन्नयन और अवनमन कोण।", ex: "Ex 9.1: Circus artist climbing a 20m long rope." },
          { titleEn: "Ch 10: Circles", titleHi: "अध्याय 10: वृत्त", descEn: "Tangent to a circle and theorems on tangents.", descHi: "वृत्त की स्पर्श रेखा और उससे संबंधित प्रमेय।", ex: "Ex 10.1 & 10.2: Prove lengths of tangents drawn from external point are equal." },
          { titleEn: "Ch 11: Areas Related to Circles", titleHi: "अध्याय 11: वृत्तों से संबंधित क्षेत्रफल", descEn: "Area of sector and segment of a circle.", descHi: "वृत्त के त्रिज्यखंड और वृत्तखंड का क्षेत्रफल।", ex: "Ex 11.1: Area of sector of circle with radius 6cm and angle 60°." },
          { titleEn: "Ch 12: Surface Areas and Volumes", titleHi: "अध्याय 12: पृष्ठीय क्षेत्रफल और आयतन", descEn: "Combinations of solids, conversion of solids.", descHi: "ठोसों के संयोजन का पृष्ठीय क्षेत्रफल और आयतन।", ex: "Ex 12.1 & 12.2: Volume of solid in shape of cone standing on hemisphere." },
          { titleEn: "Ch 13: Statistics", titleHi: "अध्याय 13: सांख्यिकी", descEn: "Mean, median, and mode of grouped data.", descHi: "वर्गीकृत आँकड़ों का माध्य, माध्यक और बहुलक।", ex: "Ex 13.1 to 13.3: Find mean marks obtained by 30 students." },
          { titleEn: "Ch 14: Probability", titleHi: "अध्याय 14: प्रायिकता", descEn: "Theoretical probability and elementary events.", descHi: "सैद्धांतिक प्रायिकता और प्रारंभिक घटनाएँ।", ex: "Ex 14.1: Two coins tossed simultaneously, find probability of getting at least one head." }
        ]
      },
      science: {
        nameEn: "Science (Vigyan)", nameHi: "विज्ञान",
        lessons: [
          { titleEn: "Ch 1: Chemical Reactions and Equations", titleHi: "अध्याय 1: रासायनिक अभिक्रियाएँ एवं समीकरण", descEn: "Balancing equations, types of chemical reactions.", descHi: "समीकरण को संतुलित करना और रासायनिक अभिक्रियाओं के प्रकार।", ex: "Textbook Qs: Why should a magnesium ribbon be cleaned before burning?" },
          { titleEn: "Ch 2: Acids, Bases and Salts", titleHi: "अध्याय 2: अम्ल, क्षारक एवं लवण", descEn: "pH scale, indicators, preparation of bleaching powder and plaster of paris.", descHi: "pH पैमाना, सूचक, विरंजक चूर्ण और प्लास्टर ऑफ पेरिस का निर्माण।", ex: "Textbook Qs: Why does distilled water not conduct electricity?" },
          { titleEn: "Ch 3: Metals and Non-metals", titleHi: "अध्याय 3: धातु एवं अधातु", descEn: "Properties of metals, reactivity series, ionic compounds.", descHi: "धातुओं के गुण, सक्रियता श्रेणी और आयनिक यौगिकों का निर्माण।", ex: "Textbook Qs: Give example of metal liquid at room temperature." },
          { titleEn: "Ch 4: Carbon and its Compounds", titleHi: "अध्याय 4: कार्बन एवं उसके यौगिक", descEn: "Covalent bonding, homologous series, soaps and detergents.", descHi: "सहसंयोजक आबंध, समजात श्रेणी, साबुन और अपमार्जक।", ex: "Textbook Qs: What is electron dot structure of CO₂?" },
          { titleEn: "Ch 5: Life Processes", titleHi: "अध्याय 5: जैव प्रक्रम", descEn: "Nutrition, respiration, transportation, and excretion in humans and plants.", descHi: "पोषण, श्वसन, परिवहन और उत्सर्जन प्रक्रम।", ex: "Textbook Qs: Why is diffusion insufficient to meet multicellular oxygen needs?" },
          { titleEn: "Ch 6: Control and Coordination", titleHi: "अध्याय 6: नियंत्रण एवं समन्वय", descEn: "Nervous system, human brain, plant hormones.", descHi: "तंत्रिका तंत्र, प्रतिवर्ती क्रिया, मानव मस्तिष्क और पादप हॉर्मोन।", ex: "Textbook Qs: What is the difference between reflex action and walking?" },
          { titleEn: "Ch 7: How do Organisms Reproduce?", titleHi: "अध्याय 7: जीव जनन कैसे करते हैं?", descEn: "Asexual and sexual reproduction, reproductive health.", descHi: "अलैंगिक और लैंगिक जनन विधियाँ, जनन स्वास्थ्य।", ex: "Textbook Qs: What is the importance of DNA copying in reproduction?" },
          { titleEn: "Ch 8: Heredity", titleHi: "अध्याय 8: आनुवंशिकता", descEn: "Mendel's laws of inheritance, sex determination.", descHi: "मेंडल के वंशागति नियम और मानव में लिंग निर्धारण।", ex: "Textbook Qs: How is sex determined in human beings?" },
          { titleEn: "Ch 9: Light – Reflection and Refraction", titleHi: "अध्याय 9: प्रकाश – परावर्तन तथा अपवर्तन", descEn: "Spherical mirrors, lens formula, refractive index.", descHi: "गोलीय दर्पण, लेंस सूत्र और अपवर्तनांक संबंधी न्यूमेरिकल।", ex: "Textbook Qs: Find focal length of convex mirror of radius 32cm." },
          { titleEn: "Ch 10: The Human Eye and the Colourful World", titleHi: "अध्याय 10: मानव नेत्र तथा रंगबिरंगा संसार", descEn: "Eye defects (Myopia, Hypermetropia), dispersion of light.", descHi: "नेत्र दृष्टि दोष और प्रकाश का प्रकीर्णन व विक्षेपण।", ex: "Textbook Qs: What is power of accommodation of human eye?" },
          { titleEn: "Ch 11: Electricity", titleHi: "अध्याय 11: विद्युत", descEn: "Ohm's law, resistance combinations, electric power.", descHi: "ओह्म का नियम, प्रतिरोधों का संयोजन और विद्युत शक्ति।", ex: "Textbook Qs: A wire of resistance R is cut into 5 equal parts." },
          { titleEn: "Ch 12: Magnetic Effects of Electric Current", titleHi: "अध्याय 12: विद्युत धारा के चुंबकीय प्रभाव", descEn: "Magnetic field lines, solenoid, electric motor, electromagnetic induction.", descHi: "चुंबकीय क्षेत्र रेखाएँ, परिनालिका, विद्युत मोटर और जनित्र।", ex: "Textbook Qs: State rule to find direction of magnetic field." },
          { titleEn: "Ch 13: Our Environment", titleHi: "अध्याय 13: हमारा पर्यावरण", descEn: "Ecosystem, food chains, ozone layer depletion.", descHi: "पारितंत्र, आहार श्रृंखला, ओजोन परत का क्षय।", ex: "Textbook Qs: Why are some substances biodegradable and some non-biodegradable?" }
        ]
      }
    };
  } else if (c === 12) {
    return {
      physics: {
        nameEn: "Physics (Bhautiki)", nameHi: "भौतिक विज्ञान",
        lessons: [
          { titleEn: "Ch 1: Electric Charges and Fields", titleHi: "अध्याय 1: वैद्युत आवेश तथा क्षेत्र", descEn: "Coulomb's Law, Electric field lines, Gauss's Law.", descHi: "कूलाम का नियम, वैद्युत क्षेत्र रेखाएँ और गॉस का प्रमेय।", ex: "NCERT Exercises: Calculate force between two small charged spheres." },
          { titleEn: "Ch 2: Electrostatic Potential and Capacitance", titleHi: "अध्याय 2: स्थिरवैद्युत विभव तथा धारिता", descEn: "Electrostatic potential, capacitance, capacitors in series and parallel.", descHi: "वैद्युत विभव, संधारित्र तथा संधारित्रों का संयोजन।", ex: "NCERT Exercises: Find equivalent capacitance of network." },
          { titleEn: "Ch 3: Current Electricity", titleHi: "अध्याय 3: विधुत धारा", descEn: "Ohm's law, Kirchhoff's laws, Wheatstone bridge.", descHi: "ओह्म का नियम, किरचॉफ के नियम, व्हीटस्टोन सेतु।", ex: "NCERT Exercises: Find current in network using Kirchhoff laws." },
          { titleEn: "Ch 4: Moving Charges and Magnetism", titleHi: "अध्याय 4: गतिमान आवेश और चुंबकत्व", descEn: "Biot-Savart Law, Ampere's circuital law, moving coil galvanometer.", descHi: "बायो-सेवर्ट नियम, एम्पियर का परिपथीय नियम, चल कुंडली गैल्वेनोमीटर।", ex: "NCERT Exercises: Magnetic field at center of circular coil." },
          { titleEn: "Ch 5: Magnetism and Matter", titleHi: "अध्याय 5: चुंबकत्व एवं द्रव्य", descEn: "Bar magnet, Earth's magnetism, magnetic properties of materials.", descHi: "छड़ चुंबक, पृथ्वी का चुंबकत्व और चुंबकीय पदार्थ।", ex: "NCERT Exercises: Magnetic moment of bar magnet." }
        ]
      },
      chemistry: {
        nameEn: "Chemistry (Rasayan)", nameHi: "रसायन विज्ञान",
        lessons: [

        <p style="margin: 0 0 12px; font-size: 0.88rem; color: var(--muted);">
          कक्षा 1 से 12 तक के सभी विषयों के <b>वास्तविक चैप्टर्स, लेसन्स, मूल प्रश्नावलियों (Exercises) और मास्टर सॉल्यूशन</b> यहाँ उपलब्ध हैं। साथ ही 24/7 AI Tutor से कोई भी सवाल पूछ सकते हैं।

        ${Array.from({length: 12}, (_, i) => i + 1).map(c => `
          <div class="class-box" onclick="state.classNum=${c}; state.view='subjects'; render();">
            Class ${c}<br><span style="font-size:0.75rem; color:var(--muted); font-weight:normal;">कक्षा ${c}</span>
          </div>
        `).join('')}
      </div>
    `;
    return;
  }

  if (state.view === 'ai_tutor') {
    app.innerHTML = `
      <div class="card">
        <h2 style="margin:0 0 8px; font-size:1.15rem;">🤖 24/7 AI Study Tutor (एआई शिक्षक)</h2>
        <p style="margin:0 0 12px; font-size:0.85rem; color:var(--muted);">कक्षा 1 से 12 तक का कोई भी सवाल, परिभाषा, समीकरण या गणितीय समस्या यहाँ पूछें:</p>
        <textarea class="ai-input" rows="3" placeholder="यहाँ अपना सवाल लिखें (जैसे: ओह्म का नियम क्या है? या Real Numbers)..." oninput="state.aiQuery=this.value">${state.aiQuery}</textarea>

    `;
    return;

    const subsObj = getSyllabusData(state.classNum);

          const s = subsObj[key];
          return `
            <div class="subj-box" onclick="state.subjectKey='${key}'; state.view='lessons'; render();">

              <div style="font-weight:900; color:var(--primary); font-size:1.1rem;">→</div>

        </div>
      </div>
    `;
  }
}

function askAITutor() {
  const q = (state.aiQuery || 'वास्तविक संख्याएँ').trim();
  state.aiResponse = `<b>प्रश्न:</b> "${q}"<br><b>AI ट्यूटर स्पष्टीकरण:</b> इस विषय को समझने के लिए सबसे पहले इसके मूल सिद्धांतों और सूत्रों को समझें। बोर्ड परीक्षा में पूरे अंक प्राप्त करने के लिए परिभाषा के साथ सही उदाहरण और मात्रक (Unit) का उल्लेख अवश्य करें। (यह उत्तर HBSE और CBSE दोनों बोर्ड के नवीनतम पाठ्यक्रम के अनुसार तैयार किया गया है)।`;
  render();
}

applyTheme();
render();
</script>
