<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 10 Master Portal • Module 2 (Mathematics Chapters 1-14)</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #070b14;
    --card: #111827;
    --card-hover: #1f2937;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
    --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.3px; }
  .brand-sub { font-size: 0.78rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .medium-switch { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 999px; }
  .med-btn {
    padding: 6px 14px; border-radius: 999px; border: none;
    background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; box-shadow: 0 2px 8px rgba(251,191,36,0.4); }
  
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 16px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; display: flex; gap: 8px; align-items: center;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .crumb-link { color: var(--primary); cursor: pointer; text-decoration: underline; }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #10b981, #4f46e5); }
  
  .subj-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; background: #dbeafe; color: #1e40af; margin-bottom: 8px; }
  
  .btn-open { display: inline-block; margin-top: 14px; font-weight: 800; color: var(--primary); font-size: 0.88rem; cursor: pointer; }
  .btn-open:hover { text-decoration: underline; }

  .sol-toggle {
    background: #0d9488; color: #fff; border: none; padding: 8px 14px; border-radius: 8px;
    font-weight: 700; font-size: 0.8rem; cursor: pointer; margin-top: 12px; display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.2s;
  }
  .sol-toggle:hover { background: #0f766e; }
  
  .sol-content { background: var(--sol-bg); border: 1px solid var(--sol-border); padding: 14px; border-radius: 12px; margin-top: 12px; font-size: 0.9rem; display: none; line-height: 1.6; }
  
  .word-meanings { background: #fef3c7; border: 1px solid #f59e0b; padding: 12px 16px; border-radius: 12px; font-size: 0.85rem; margin-top: 12px; color: #78350f; font-weight: 500; }
  body.light .word-meanings { background: #fffbeb; color: #92400e; border-color: #fcd34d; }

  .guess-paper-box {
    background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(13, 148, 136, 0.08));
    border: 1px dashed var(--primary); padding: 16px; border-radius: 14px; margin-top: 16px;
  }

  .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
  .tab-btn { background: var(--sub-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 0.82rem; cursor: pointer; white-space: nowrap; }
  .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand-row">
      <div>
        <h1 class="brand-title">Class 10 Master Portal (CBSE & HBSE)</h1>
        <p class="brand-sub">Module 2: Mathematics Complete (All 14 Chapters + Guess Papers)</p>
      </div>
      <div class="top-controls">
        <div class="medium-switch">
          <button class="med-btn active" id="btnEn" onclick="setMedium('en')">English + Meanings</button>
          <button class="med-btn" id="btnHi" onclick="setMedium('hi')">Hindi Medium</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>
  Class 10 Master Portal • Module 2 (Mathematics) • Zero Data Loss Engine
</footer>

<script>
const SafeStore = {
  get(k, f) { try { const v = localStorage.getItem(k); return v !== null ? v : f; } catch(e){ return f; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  medium: SafeStore.get('mp_med', 'en'),
  isDark: SafeStore.get('mp_dark', '1') === '1',
  view: 'home', // 'home', 'math_chapters', 'math_lesson'
  lessonId: null,
  activeTab: 'book'
};

function applyTheme() {
  document.body.classList.toggle('light', !state.isDark);
}
function toggleTheme() {
  state.isDark = !state.isDark;
  SafeStore.set('mp_dark', state.isDark ? '1' : '0');
  applyTheme();
}

function setMedium(m) {
  state.medium = m;
  SafeStore.set('mp_med', m);
  document.getElementById('btnEn').classList.toggle('active', m === 'en');
  document.getElementById('btnHi').classList.toggle('active', m === 'hi');
  render();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (state.view === 'home') {
    bc.innerHTML = `<span>🏠 All Subjects (सभी विषय) • Module 2 Active</span>`;
  } else if (state.view === 'math_chapters') {
    bc.innerHTML = `<span class="crumb-link" onclick="state.view='home';render();">All Subjects</span> › <span>Mathematics (14 Chapters)</span>`;
  } else if (state.view === 'math_lesson') {
    const les = MATH_LESSONS.find(l => l.id === state.lessonId);
    bc.innerHTML = `<span class="crumb-link" onclick="state.view='home';render();">All Subjects</span> › <span class="crumb-link" onclick="state.view='math_chapters';state.lessonId=null;render();">Mathematics</span> › <span>${les.num}: ${state.medium==='hi'?les.titleHi:les.titleEn}</span>`;
  }
}

const MATH_LESSONS = [
  {
    id: 'm1', num: 'Ch 1', titleEn: 'Real Numbers', titleHi: 'वास्तविक संख्याएँ',
    conceptEn: 'Fundamental Theorem of Arithmetic: Every composite number can be expressed uniquely as a product of primes. For any two positive integers a and b: HCF(a, b) × LCM(a, b) = a × b.',
    conceptHi: 'अंकगणित की आधारभूत प्रमेय: प्रत्येक भाज्य संख्या को अभाज्य संख्याओं के गुणनफल के रूप में व्यक्त किया जा सकता है। HCF × LCM = a × b.',
    wordsEn: 'Composite Number = भाज्य संख्या | Prime Factorisation = अभाज्य गुणनखंडन | Irrational = अपरिमेय',
    wordsHi: 'Composite Number = भाज्य संख्या | Prime Factorisation = अभाज्य गुणनखंडन | Irrational = अपरिमेय',
    exercises: [
      { qEn: 'Find the LCM and HCF of 26 and 91 and verify that LCM × HCF = product of the two numbers.', qHi: '26 और 91 के HCF और LCM ज्ञात कीजिए तथा जाँच कीजिए कि LCM × HCF = दोनों संख्याओं का गुणनफल है।', sol: '<b>HCF = 13, LCM = 182</b><br>Verification: 182 × 13 = 2366 = 26 × 91 (सत्यापित)।' },
      { qEn: 'Prove that √5 is irrational.', qHi: 'सिद्ध कीजिए कि √5 एक अपरिमेय संख्या है।', sol: 'विरोधाभास विधि द्वारा: मान लीजिए √5 = a/b, वर्ग करने पर 5b² = a², जिससे सिद्ध होता है कि √5 अपरिमेय है।' }
    ],
    guess1: [{ qEn: 'Explain why 7 × 11 × 13 + 13 is a composite number.', qHi: 'समझाइए कि 7 × 11 × 13 + 13 एक भाज्य संख्या क्यों है?', sol: '13 कॉमन लेने पर 13(77 + 1) = 13 × 78, अतः यह भाज्य संख्या है।' }],
    guess2: [{ qEn: 'Prove that 3 + 2√5 is irrational.', qHi: 'सिद्ध कीजिए कि 3 + 2√5 एक अपरिमेय संख्या है।', sol: 'मान लीजिए यह परिमेय है, समीकरण को हल करने पर √5 परिमेय प्राप्त होता है जो सत्य नहीं है। अतः यह अपरिमेय है।' }]
  },
  {
    id: 'm2', num: 'Ch 2', titleEn: 'Polynomials', titleHi: 'बहुपद',
    conceptEn: 'Sum of zeroes (α + β) = -b/a, Product of zeroes (αβ) = c/a for quadratic polynomial ax² + bx + c.',
    conceptHi: 'द्विघात बहुपद के शून्यकों का योग (α + β) = -b/a और गुणनफल (αβ) = c/a.',
    wordsEn: 'Polynomial = बहुपद | Zeroes = शून्यक | Coefficients = गुणांक',
    wordsHi: 'Polynomial = बहुपद | Zeroes = शून्यक | Coefficients = गुणांक',
    exercises: [{ qEn: 'Find zeroes of x² - 2x - 8 and verify relationship.', qHi: 'x² - 2x - 8 के शून्यक ज्ञात कीजिए और संबंध की जाँच कीजिए।', sol: 'शून्यक 4 और -2 हैं। योग = 2, गुणनफल = -8।' }],
    guess1: [{ qEn: 'Find quadratic polynomial with sum and product as -3 and 2.', qHi: 'शून्यकों का योग -3 और गुणनफल 2 वाला बहुपद ज्ञात कीजिए।', sol: 'x² + 3x + 2' }],
    guess2: [{ qEn: 'If one zero is reciprocal of other in (a² + 9)x² + 13x + 6a, find a.', qHi: 'यदि एक शून्यक दूसरे का व्युत्क्रम हो, तो a ज्ञात कीजिए।', sol: 'गुणनफल 1 रखने पर a = 3 प्राप्त होता है।' }]
  },
  {
    id: 'm3', num: 'Ch 3', titleEn: 'Pair of Linear Equations in Two Variables', titleHi: 'दो चरों वाले रैखिक समीकरण युग्म',
    conceptEn: 'Graphical and algebraic methods for solving linear equations.',
    conceptHi: 'रैखिक समीकरण युग्म को हल करने की बीजगणितीय विधियाँ।',
    wordsEn: 'Consistent = संगत | Substitution = प्रतिस्थापन | Elimination = विलोपन',
    wordsHi: 'Consistent = संगत | Substitution = प्रतिस्थापन | Elimination = विलोपन',
    exercises: [{ qEn: 'Solve 2x + 3y = 11 and 2x - 4y = -24.', qHi: '2x + 3y = 11 और 2x - 4y = -24 को हल करें।', sol: 'x = -2, y = 5' }],
    guess1: [{ qEn: '10 students took part in quiz. If girls are 4 more than boys, find count.', qHi: '10 विद्यार्थियों ने पहेली में भाग लिया। यदि लड़कियाँ लड़कों से 4 अधिक हों, तो संख्या बताएँ।', sol: 'लड़के 3, लड़कियाँ 7' }],
    guess2: [{ qEn: 'Solve graphically: x - y = 1 and 2x + 3y = 12.', qHi: 'ग्राफ़ से हल करें: x - y = 1 और 2x + 3y = 12.', sol: 'प्रतिच्छेद बिंदु (3, 2)' }]
  },
  {
    id: 'm4', num: 'Ch 4', titleEn: 'Quadratic Equations', titleHi: 'द्विघात समीकरण',
    conceptEn: 'Quadratic formula x = (-b ± √(b² - 4ac)) / 2a. Discriminant D = b² - 4ac.',
    conceptHi: 'द्विघात सूत्र और विविक्तकर D = b² - 4ac.',
    wordsEn: 'Discriminant = विविक्तकर | Real Roots = वास्तविक मूल',
    wordsHi: 'Discriminant = विविक्तकर | Real Roots = वास्तविक मूल',
    exercises: [{ qEn: 'Find roots of 2x² - 7x + 3 = 0 by factorization.', qHi: 'गुणनखंड विधि से 2x² - 7x + 3 = 0 के मूल निकालें।', sol: 'x = 3 और x = 1/2' }],
    guess1: [{ qEn: 'Find discriminant of 3x² - 2x + 1/3 = 0.', qHi: '3x² - 2x + 1/3 = 0 का विविक्तकर ज्ञात करें।', sol: 'D = 0 (मूल वास्तविक और समान)' }],
    guess2: [{ qEn: 'A train travels 360 km at uniform speed. If speed was 5 km/h more, it takes 1 hour less.', qHi: 'एक रेलगाड़ी 360 किमी चलती है। चाल 5 किमी/घंटा अधिक होने पर 1 घंटा कम लेती है।', sol: 'चाल = 40 किमी/घंटा' }]
  },
  {
    id: 'm5', num: 'Ch 5', titleEn: 'Arithmetic Progressions', titleHi: 'समांतर श्रेढ़ियाँ',
    conceptEn: 'nth term an = a + (n - 1)d. Sum Sn = n/2 [2a + (n - 1)d].',
    conceptHi: 'nवाँ पद और n पदों का योग।',
    wordsEn: 'Common difference = सार्व अंतर | AP = समांतर श्रेढ़ी',
    wordsHi: 'Common difference = सार्व अंतर | AP = समांतर श्रेढ़ी',
    exercises: [{ qEn: 'Find 11th term of AP: -3, -1/2, 2, ...', qHi: 'AP: -3, -1/2, 2, ... का 11वाँ पद ज्ञात करें।', sol: '22' }],
    guess1: [{ qEn: 'Find sum of first 22 terms where d = 7 and 22nd term is 149.', qHi: 'प्रथम 22 पदों का योग ज्ञात करें जहाँ d = 7 और 22वाँ पद 149 है।', sol: '1661' }],
    guess2: [{ qEn: 'If sum of first n terms is 4n - n², find first term.', qHi: 'यदि प्रथम n पदों का योग 4n - n² है, तो प्रथम पद क्या है?', sol: 'प्रथम पद = 3' }]
  },
  {
    id: 'm6', num: 'Ch 6', titleEn: 'Triangles', titleHi: 'त्रिभुज',
    conceptEn: 'Basic Proportionality Theorem (Thales Theorem) and similarity criteria.',
    conceptHi: 'थेल्स प्रमेय और समरूपता कसौटियाँ।',
    wordsEn: 'Similarity = समरूपता | Proportional = आनुपातिक',
    wordsHi: 'Similarity = समरूपता | Proportional = आनुपातिक',
    exercises: [{ qEn: 'If a line divides two sides in same ratio, it is parallel to third side.', qHi: 'यदि एक रेखा दो भुजाओं को एक ही अनुपात में बांटे, तो वह तीसरी भुजा के समांतर होती है।', sol: 'थेल्स प्रमेय से सत्यापित।' }],
    guess1: [{ qEn: 'Determine right triangles from given side lengths.', qHi: 'दी गई भुजाओं से समकोण त्रिभुज पहचानें।', sol: 'पाइथागोरस त्रिक का प्रयोग करें।' }],
    guess2: [{ qEn: 'Prove ratio of areas of similar triangles equals square of ratio of sides.', qHi: 'सिद्ध कीजिए कि समरूप त्रिभुजों के क्षेत्रफलों का अनुपात संगत भुजाओं के वर्ग के बराबर होता है।', sol: 'लंब खींचकर सिद्ध किया जाता है।' }]
  },
  {
    id: 'm7', num: 'Ch 7', titleEn: 'Coordinate Geometry', titleHi: 'निर्देशांक ज्यामिति',
    conceptEn: 'Distance formula and section formula.',
    conceptHi: 'दूरी सूत्र और विभाजन सूत्र।',
    wordsEn: 'Coordinate = निर्देशांक | Section Formula = विभाजन सूत्र',
    wordsHi: 'Coordinate = निर्देशांक | Section Formula = विभाजन सूत्र',
    exercises: [{ qEn: 'Find distance between (2, 3) and (4, 1).', qHi: '(2, 3) और (4, 1) के बीच की दूरी निकालें।', sol: '2√2 units' }],
    guess1: [{ qEn: 'Find point dividing (-1, 7) and (4, -3) in ratio 2:3.', qHi: 'बिंदुओं (-1, 7) और (4, -3) को 2:3 में बांटने वाले बिंदु के निर्देशांक निकालें।', sol: '(1, 3)' }],
    guess2: [{ qEn: 'Find relation between x and y if (x, y) is equidistant from (7, 1) and (3, 5).', qHi: 'x और y में संबंध ज्ञात करें यदि बिंदु (x, y) समदूरस्थ हो।', sol: 'x - y = 2' }]
  },
  {
    id: 'm8', num: 'Ch 8', titleEn: 'Introduction to Trigonometry', titleHi: 'त्रिकोणमिति का परिचय',
    conceptEn: 'Trigonometric ratios and identities (sin²θ + cos²θ = 1).',
    conceptHi: 'त्रिकोणमितीय अनुपात और सर्वसमिकाएँ।',
    wordsEn: 'Hypotenuse = कर्ण | Identity = सर्वसमिका',
    wordsHi: 'Hypotenuse = कर्ण | Identity = सर्वसमिका',
    exercises: [{ qEn: 'If sin A = 3/4, calculate cos A and tan A.', qHi: 'यदि sin A = 3/4 हो, तो cos A और tan A ज्ञात करें।', sol: 'cos A = √7/4, tan A = 3/√7' }],
    guess1: [{ qEn: 'Evaluate: 2 tan² 45° + cos² 30° - sin² 60°', qHi: 'मान निकालें: 2 tan² 45° + cos² 30° - sin² 60°', sol: '2' }],
    guess2: [{ qEn: 'Prove (sin θ - 2 sin³ θ) / (2 cos³ θ - cos θ) = tan θ', qHi: 'सिद्ध करें (sin θ - 2 sin³ θ) / (2 cos³ θ - cos θ) = tan θ', sol: 'कॉमन लेकर हल करने पर tan θ प्राप्त होता है।' }]
  },
  {
    id: 'm9', num: 'Ch 9', titleEn: 'Some Applications of Trigonometry', titleHi: 'त्रिकोणमिति के कुछ अनुप्रयोग',
    conceptEn: 'Heights and distances using angle of elevation and depression.',
    conceptHi: 'उन्नयन और अवनमन कोण द्वारा ऊँचाई और दूरी ज्ञात करना।',
