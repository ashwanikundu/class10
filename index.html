    --sol-border: #059669;

  body.light {
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --primary-glow: rgba(79, 70, 229, 0.15);
    --secondary: #0d9488;
    --accent: #f59e0b;
    --bg: #f4f6fb;
    --card: #ffffff;

    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;

    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
    --green-bg: #dcfce7;

  footer { text-align: center; padding: 24px; color: var(--muted); font-size: 0.8rem; }
</style>

<script>
const SafeStore = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v !== null ? v : fallback; } catch (e) { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }
};

let state = {
  view: 'home',
  activeClass: SafeStore.get('m_class', '10'),
  activeBoard: SafeStore.get('m_board', 'CBSE + HBSE'),
  medium: SafeStore.get('m_med', 'hi'),
  isDark: SafeStore.get('m_dark', '1') === '1',
  subjectId: null,
  lessonId: null
};

function applyPrefs() {
  document.body.classList.toggle('light', !state.isDark);
  document.getElementById('btnHi').classList.toggle('active', state.medium === 'hi');
  document.getElementById('btnEn').classList.toggle('active', state.medium === 'en');
}

function toggleTheme() {
  state.isDark = !state.isDark;
  SafeStore.set('m_dark', state.isDark ? '1' : '0');
  applyPrefs();
}

function setMedium(m) {
  state.medium = m;
  SafeStore.set('m_med', m);
  applyPrefs();
  render();
}

function switchView(v) {
  state.view = v;
  if (v !== 'home') { state.subjectId = null; state.lessonId = null; }
  document.querySelectorAll('.qnav-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('nav_' + v);
  if (btn) btn.classList.add('active');
  render();
}

function getActiveDB() {
  if (state.activeClass === '10') return DB;
  return ALL_CLASSES_DB[state.activeClass] || DB;
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let html = `<button class="crumb-btn" onclick="switchView('home')">🏠 Class ${state.activeClass} (${state.activeBoard})</button>`;
  if (state.subjectId) {
    const subj = getActiveDB().find(s => s.id === state.subjectId);
    if (subj) html += ` <span>›</span> <button class="crumb-btn" onclick="selectSubject('${subj.id}')">${subj.titleEn}</button>`;
    if (state.lessonId) {
      const les = subj.lessons.find(l => l.id === state.lessonId);
      if (les) html += ` <span>›</span> <strong>${les.num}: ${les.titleEn}</strong>`;
    }
  }
  bc.innerHTML = html;
}

function handleScanFile(files) {
  if (!files || !files.length) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    scanState.imgUrl = e.target.result;
    renderPreviewBox();
  };
  reader.readAsDataURL(files[0]);
}

function renderPreviewBox() {
  const area = document.getElementById('scanPreviewArea');
  if (!area) return;
  area.innerHTML = `
    <div class="card">
      <h3>📄 Scanned Page Preview (6x Ultra-Zoom)</h3>
      <div class="scanner-stage">
        <img id="scanImg" src="${scanState.imgUrl}" style="transform:scale(${scanState.zoom}) translate(${scanState.panX}px,${scanState.panY}px);" alt="Scan">
        <div class="zoom-hud">
          <span>Zoom: <strong>${scanState.zoom.toFixed(1)}x</strong></span>
          <button class="tool-icon-btn" onclick="scanState.zoom=Math.max(1,scanState.zoom-0.5);renderPreviewBox();">-</button>
          <input type="range" min="1" max="5" step="0.5" value="${scanState.zoom}" oninput="scanState.zoom=parseFloat(this.value);renderPreviewBox();">
          <button class="tool-icon-btn" onclick="scanState.zoom=Math.min(5,scanState.zoom+0.5);renderPreviewBox();">+</button>
          <button class="tool-icon-btn" onclick="scanState.zoom=1;scanState.panX=0;scanState.panY=0;renderPreviewBox();">Reset</button>
        </div>
      </div>
      <textarea class="scan-textarea" placeholder="यहाँ कोई भी सवाल या समीकरण लिखें (जैसे: 245 * 18 या x^2 - 5x + 6 = 0)..." oninput="scanState.query=this.value;">${scanState.query}</textarea>
      <button class="btn" style="margin-top:12px;" onclick="runSmartSolve()">⚡ Awwal Darje ka Instant Solution देखें</button>
      <div id="scanSolOutput"></div>
    </div>
  `;
}

function runSmartSolve() {
  const q = (scanState.query || '245 * 18').trim();
  let ansText = '';
  if (q.includes('*')) {
    const p = q.split('*');
    ansText = `गणितीय गुणनफल: ${q} = <b>${parseFloat(p[0]) * parseFloat(p[1])}</b>`;
  } else {
    ansText = `<b>प्रश्न:</b> "${q}"<br><b>सरल और देसी मास्टर स्पष्टीकरण:</b> इस सवाल को हल करने के लिए सबसे पहले सूत्र का मान रखें और चरणों के अनुसार आगे बढ़ें। बोर्ड परीक्षा में पूरे नंबर पाने के लिए अंत में मात्रक (Unit) ज़रूर लिखें!`;
  }
  const out = document.getElementById('scanSolOutput');
  if (out) {
    out.className = 'tutor-bubble';
    out.innerHTML = `<h4>💡 Awwal Darje ka AI Tutor Explanation</h4><div>${ansText}</div>`;
  }
}

function startVoiceRecognition() {
  const out = document.getElementById('voiceOutput');
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    out.textContent = "⚠️ आपके ब्राउज़र में वॉइस रिकग्निशन सपोर्ट नहीं है। कृपया टाइप करके सर्च करें।";
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = 'hi-IN';
  recognition.onstart = function() { out.textContent = "🎙️ सुन रहे हैं... बोलिए क्या पढ़ना है?"; };
  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    out.textContent = `✅ आपने बोला: "${text}" — पाठ लोड हो रहा है...`;
    setTimeout(() => { switchView('home'); }, 1000);
  };
  recognition.onerror = function() { out.textContent = "⚠️ आवाज़ सुनाई नहीं दी, कृपया दोबारा बोलें।"; };
  recognition.start();
}
