<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 1 • Hindi (Rimjhim) - Complete Exercises & Solutions</title>
<style>
  :root {
    --primary: #4f46e5;
    --bg: #070b14;
    --card: #111827;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.15rem; font-weight: 900; }
  .brand-sub { font-size: 0.75rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 6px; align-items: center; }
  .medium-switch { display: flex; gap: 4px; background: rgba(255,255,255,0.1); padding: 3px; border-radius: 999px; }
  .med-btn {
    padding: 5px 12px; border-radius: 999px; border: none; background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.75rem; cursor: pointer;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; }
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 5px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 14px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .crumb-link { color: var(--primary); cursor: pointer; text-decoration: underline; }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #10b981, #4f46e5); }
  
  .section-heading {
    font-size: 1.1rem; font-weight: 900; color: var(--primary); margin: 0 0 14px 0;
    display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 8px;
  }

  .q-box {
    background: var(--sub-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .question {
    font-weight: 800; color: var(--text); margin-bottom: 10px; font-size: 0.95rem;
  }
  .solution {
    background: var(--sol-bg); border: 1px solid var(--sol-border); padding: 12px 14px; border-radius: 10px;
    font-size: 0.9rem; color: var(--text); line-height: 1.6;
  }
  .math { color: #f59e0b; font-weight: 800; font-style: italic; }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div>
      <h1 class="brand-title">Class 1 • Hindi (Rimjhim) - Exercises & Solutions</h1>
      <p class="brand-sub">HBSE & CBSE Aligned Complete Chapter Solutions Hub</p>
    </div>
    <div class="top-controls">
      <div class="medium-switch">
        <button class="med-btn active" id="btnHi" onclick="setMedium('hi')">हिंदी</button>
        <button class="med-btn" id="btnEn" onclick="setMedium('en')">English</button>
      </div>
      <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>Class 1 Hindi Master Portal • HBSE & CBSE Hub</footer>

<script>
const Store = {
  get: (k, f) => { try { return localStorage.getItem(k) ?? f; } catch(e){ return f; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  med: Store.get('mp_med', 'hi'),
  dark: Store.get('mp_dark', '1') === '1',
  chapter: 1
};

function applyTheme() { document.body.classList.toggle('light', !state.dark); }
function toggleTheme() { state.dark = !state.dark; Store.set('mp_dark', state.dark ? '1' : '0'); applyTheme(); }
function setMedium(m) { 
  state.med = m; 
  Store.set('mp_med', m); 
  document.getElementById('btnHi').classList.toggle('active', m==='hi'); 
  document.getElementById('btnEn').classList.toggle('active', m==='en'); 
  render(); 
}

const chapters = [
  {
    id: 1,
    titleHi: "पाठ 1: झूला (कविता)",
    titleEn: "Chapter 1: Jhula (Poem)",
    qs: [
      {
        qHi: "प्रश्न 1: अम्मा, आज लगा दे झूला... इस कविता में बच्चा अम्मा से क्या लगाने के लिए कह रहा है?",
        qEn: "Q1: Amma, aaj laga de jhula... What is the child asking Amma to set up in the poem?",
        sHi: "उत्तर: बच्चा अपनी अम्मा (माता) से घर के आँगन में झूला लगाने के लिए कह रहा है, ताकि वह उस पर झूल सके।",
        sEn: "Ans: The child is asking Amma to set up a swing in the courtyard so he can swing on it."
      },
      {
        qHi: "प्रश्न 2: झूले को किन-किन चीजों से झुलाया जा सकता है?",
        qEn: "Q2: What things can be used to swing or what can be imagined with the swing?",
        sHi: "उत्तर: कविता और कल्पना के अनुसार झूले को पेड़ की डाली, धरती, आसमान और हवा के झोंकों के साथ झुलाया जा सकता है।",
        sEn: "Ans: According to the poem and imagination, the swing can be imagined with tree branches, earth, sky, and breeze."
      },
      {
        qHi: "प्रश्न 3: इन चीजों पर झूला झूलने में कैसा अनुभव होता है?",
        qEn: "Q3: How does it feel to swing on these things?",
        sHi: "उत्तर: पेड़ की डाली पर झूलने से <span class='math'>ऊपर-नीचे</span> जाने का आनंद मिलता है और हवा के साथ ऐसा लगता है मानो हम आसमान को छू रहे हैं।",
        sEn: "Ans: Swinging on tree branches gives the joy of going <span class='math'>up and down</span>, and with the breeze, it feels like touching the sky."
      }
    ]
  },
  {
    id: 2,
    titleHi: "पाठ 2: आम की कहानी (चित्र कथा)",
    titleEn: "Chapter 2: Aam ki Kahaani (Picture Story)",
    qs: [
      {
        qHi: "प्रश्न 1: चित्रकथा को देखकर घटनाओं को सही क्रम (1 से 4) में लगाएँ:",
        qEn: "Q1: Look at the picture story and arrange events in correct order (1 to 4):",
        sHi: "उत्तर: सही क्रम इस प्रकार है —<br>1. पेड़ पर रसीले आम दिखना<br>2. कौवे द्वारा आम पर चोंच मारना<br>3. आम का टहनी से छूटकर नीचे गिरना<br>4. छोटी लड़की द्वारा खुशी-खुशी आम उठाना",
        sEn: "Ans: Correct order —<br>1. Seeing juicy mangoes on tree<br>2. Crow pecking the mango<br>3. Mango falling down from branch<br>4. Little girl happily picking up the mango"
      },
      {
        qHi: "प्रश्न 2: पेड़ पर कौन-कौन बैठा था?",
        qEn: "Q2: Who was sitting on the tree?",
        sHi: "उत्तर: पेड़ पर एक कौवा और एक गिलहरी बैठी थी।",
        sEn: "Ans: A crow and a squirrel were sitting on the tree."
      }
    ]
  },
  {
    id: 3,
    titleHi: "पाठ 3: आम की टोकरी (कविता)",
    titleEn: "Chapter 3: Aam ki Tokri (Poem)",
    qs: [
      {
        qHi: "प्रश्न 1: लड़की सिर पर क्या लेकर जा रही है?",
        qEn: "Q1: What is the girl carrying on her head?",
        sHi: "उत्तर: लड़की सिर पर आम से भरी हुई टोकरी लेकर जा रही है।",
        sEn: "Ans: The girl is carrying a basket full of mangoes on her head."
      },
      {
        qHi: "प्रश्न 2: लड़की कितने साल की है और उसने टोकरी में क्या भरा है?",
        qEn: "Q2: How old is the girl and what has she filled in her basket?",
        sHi: "उत्तर: लड़की छह साल की है और उसने टोकरी में मीठे-मीठे आम भरे हैं।",
        sEn: "Ans: The girl is six years old and she has filled sweet mangoes in the basket."
      }
    ]
  }
];

function render() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = `<span class="crumb-link" onclick="state.chapter=1; render();">Class 1 Hindi</span> › <span>Chapter ${state.chapter} Exercises & Solutions</span>`;

  const app = document.getElementById('app');
  let html = `
    <div class="card" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
      ${chapters.map(ch => `
        <button class="btn" style="background:${state.chapter===ch.id?'var(--primary)':'var(--sub-bg)'}; border:1px solid var(--border); color:${state.chapter===ch.id?'#fff':'var(--text)'}; padding:8px 14px; border-radius:8px; font-weight:800; cursor:pointer;" onclick="state.chapter=${ch.id}; render();">
          ${state.med==='hi'?ch.titleHi:ch.titleEn}
        </button>
      `).join('')}
    </div>
  `;

  const curr = chapters.find(c => c.id === state.chapter);
  html += `
    <div class="card">
      <h2 class="section-heading">📚 ${state.med==='hi'?curr.titleHi:curr.titleEn} - Exercises & Master Solutions</h2>
  `;

  curr.qs.forEach((item, idx) => {
    html += `
      <div class="q-box">
        <div class="question">${state.med==='hi'?item.qHi:item.qEn}</div>
        <div class="solution"><strong>${state.med==='hi'?'उत्तर / Solution:':'Answer / Solution:'}</strong><br>${state.med==='hi'?item.sHi:item.sEn}</div>
      </div>
    `;
  });

  html += `</div>`;
  app.innerHTML = html;
}

applyTheme();
render();
</script>
</body>
</html>
