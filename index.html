<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 10 Master Portal • Module 7 (Interactive Quiz & Self-Assessment Engine)</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #070b14;
    --card: #111827;
    --card-hover: #1f2937;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
    --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.3px; }
  .brand-sub { font-size: 0.78rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .medium-switch { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 999px; }
  .med-btn {
    padding: 6px 14px; border-radius: 999px; border: none;
    background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; box-shadow: 0 2px 8px rgba(251,191,36,0.4); }
  
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 16px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; display: flex; gap: 8px; align-items: center;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #f59e0b, #ec4899); }
  
  .btn {
    background: linear-gradient(135deg, #f59e0b, #d97706); color: #090d16; border: none;
    padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem;
  }
  
  .quiz-option {
    display: block; width: 100%; background: var(--sub-bg); border: 1px solid var(--border); color: var(--text);
    padding: 12px 16px; border-radius: 10px; margin-top: 10px; text-align: left; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
  }
  .quiz-option:hover { border-color: var(--primary); background: rgba(79,70,229,0.1); }
  .quiz-option.correct { background: #064e3b; border-color: #059669; color: #34d399; }
  .quiz-option.wrong { background: #7f1d1d; border-color: #dc2626; color: #fca5a5; }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand-row">
      <div>
        <h1 class="brand-title">Class 10 Master Portal (CBSE & HBSE)</h1>
        <p class="brand-sub">Module 7: Interactive Quiz & Self-Assessment Engine</p>
      </div>
      <div class="top-controls">
        <div class="medium-switch">
          <button class="med-btn active" id="btnEn" onclick="setMedium('en')">English + Meanings</button>
          <button class="med-btn" id="btnHi" onclick="setMedium('hi')">Hindi Medium</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>
  Class 10 Master Portal • Module 7 (Quiz Engine) • Zero Data Loss Engine
</footer>

<script>
const SafeStore = {
  get(k, f) { try { const v = localStorage.getItem(k); return v !== null ? v : f; } catch(e){ return f; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  medium: SafeStore.get('mp_med', 'en'),
  isDark: SafeStore.get('mp_dark', '1') === '1',
  quizIndex: 0,
  score: 0,
  selectedOpt: null,
  isAnswered: false
};

const QUIZ_QUESTIONS = [
  {
    qEn: "What is the HCF of smallest prime number and smallest composite number?",
    qHi: "सबसे छोटी अभाज्य संख्या और सबसे छोटी भाज्य संख्या का HCF क्या है?",
    optionsEn: ["1", "2", "4", "8"],
    optionsHi: ["1", "2", "4", "8"],
    correct: 1
  },
  {
    qEn: "If the sum of zeroes of quadratic polynomial kx² + 2x + 3k is equal to their product, find k.",
    qHi: "यदि द्विघात बहुपद kx² + 2x + 3k के शून्यकों का योग उनके गुणनफल के बराबर हो, तो k ज्ञात करें।",
    optionsEn: ["1/3", "-2/3", "2/3", "-1/3"],
    optionsHi: ["1/3", "-2/3", "2/3", "-1/3"],
    correct: 1
  },
  {
    qEn: "Which of the following is a physical change?",
    qHi: "निम्नलिखित में से कौन सा एक भौतिक परिवर्तन है?",
    optionsEn: ["Burning of magnesium ribbon", "Melting of ice", "Digestion of food", "Rusting of iron"],
    optionsHi: ["मैग्नीशियम रिबन का जलना", "बर्फ का पिघलना", "भोजन का पाचन", "लोहे पर जंग लगना"],
    correct: 1
  },
  {
    qEn: "The focal length of a convex mirror of radius of curvature 32 cm is:",
    qHi: "32 सेमी वक्रता त्रिज्या वाले उत्तल दर्पण की फोकस दूरी होगी:",
    optionsEn: ["+16 cm", "-16 cm", "+32 cm", "-32 cm"],
    optionsHi: ["+16 cm", "-16 cm", "+32 cm", "-32 cm"],
    correct: 0
  }
];

function applyTheme() {
  document.body.classList.toggle('light', !state.isDark);
}
function toggleTheme() {
  state.isDark = !state.isDark;
  SafeStore.set('mp_dark', state.isDark ? '1' : '0');
  applyTheme();
}

function setMedium(m) {
  state.medium = m;
  SafeStore.set('mp_med', m);
  document.getElementById('btnEn').classList.toggle('active', m === 'en');
  document.getElementById('btnHi').classList.toggle('active', m === 'hi');
  render();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = `<span>🏠 All Utilities • Module 7 (Interactive Self-Assessment Quiz)</span>`;
}

function render() {
  renderBreadcrumb();
  const app = document.getElementById('app');

  if (state.quizIndex >= QUIZ_QUESTIONS.length) {
    app.innerHTML = `
      <div class="card" style="text-align:center; padding:30px;">
        <h2 style="margin:0 0 10px; color:#34d399;">🏆 Quiz Completed Successfully!</h2>
        <p style="font-size:1.1rem; margin-bottom:16px;">Your Score: <b>${state.score} / ${QUIZ_QUESTIONS.length}</b></p>
        <button class="btn" onclick="resetQuiz()">🔄 Restart Quiz</button>
      </div>
    `;
    return;
  }

  const q = QUIZ_QUESTIONS[state.quizIndex];
  const opts = state.medium === 'hi' ? q.optionsHi : q.optionsEn;

  app.innerHTML = `
    <div class="card">
      <div style="font-size:0.78rem; font-weight:700; color:var(--muted); margin-bottom:6px;">Question ${state.quizIndex + 1} of ${QUIZ_QUESTIONS.length}</div>
      <h3 style="margin:0 0 16px; font-size:1.05rem;">${state.medium === 'hi' ? q.qHi : q.qEn}</h3>
      <div>
        ${opts.map((opt, idx) => `
          <button class="quiz-option ${state.isAnswered ? (idx === q.correct ? 'correct' : (idx === state.selectedOpt ? 'wrong' : '')) : ''}" 
                  onclick="selectOption(${idx})" ${state.isAnswered ? 'disabled' : ''}>
            ${String.fromCharCode(65 + idx)}. ${opt}
          </button>
        `).join('')}
      </div>
      ${state.isAnswered ? `<button class="btn" style="margin-top:16px; width:100%; justify-content:center;" onclick="nextQuestion()">अगला प्रश्न (Next Question) →</button>` : ''}
    </div>
  `;
}

function selectOption(idx) {
  if (state.isAnswered) return;
  state.selectedOpt = idx;
  state.isAnswered = true;
  const q = QUIZ_QUESTIONS[state.quizIndex];
  if (idx === q.correct) {
    state.score++;
  }
  render();
}

function nextQuestion() {
  state.quizIndex++;
  state.selectedOpt = null;
  state.isAnswered = false;
  render();
}

function resetQuiz() {
  state.quizIndex = 0;
  state.score = 0;
  state.selectedOpt = null;
  state.isAnswered = false;
  render();
}

applyTheme();
render();
</script>
</body>
</html>
