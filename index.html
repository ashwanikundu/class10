<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 1 • Mathematics (Math Magic) - Complete Exercises & Solutions</title>
<style>
  :root {
    --primary: #4f46e5;
    --bg: #070b14;
    --card: #111827;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.15rem; font-weight: 900; }
  .brand-sub { font-size: 0.75rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 6px; align-items: center; }
  .medium-switch { display: flex; gap: 4px; background: rgba(255,255,255,0.1); padding: 3px; border-radius: 999px; }
  .med-btn {
    padding: 5px 12px; border-radius: 999px; border: none; background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.75rem; cursor: pointer;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; }
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 5px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 14px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .crumb-link { color: var(--primary); cursor: pointer; text-decoration: underline; }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #10b981, #4f46e5); }
  
  .section-heading {
    font-size: 1.1rem; font-weight: 900; color: var(--primary); margin: 0 0 14px 0;
    display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 8px;
  }

  .q-box {
    background: var(--sub-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .question {
    font-weight: 800; color: var(--text); margin-bottom: 10px; font-size: 0.95rem;
  }
  .solution {
    background: var(--sol-bg); border: 1px solid var(--sol-border); padding: 12px 14px; border-radius: 10px;
    font-size: 0.9rem; color: var(--text); line-height: 1.6;
  }
  .math { color: #f59e0b; font-weight: 800; font-style: italic; }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div>
      <h1 class="brand-title">Class 1 • Mathematics (Math Magic) - Exercises & Solutions</h1>
      <p class="brand-sub">HBSE & CBSE Aligned Complete Chapter Solutions Hub</p>
    </div>
    <div class="top-controls">
      <div class="medium-switch">
        <button class="med-btn active" id="btnHi" onclick="setMedium('hi')">हिंदी</button>
        <button class="med-btn" id="btnEn" onclick="setMedium('en')">English</button>
      </div>
      <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>Class 1 Mathematics Master Portal • HBSE & CBSE Hub</footer>

<script>
const Store = {
  get: (k, f) => { try { return localStorage.getItem(k) ?? f; } catch(e){ return f; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  med: Store.get('mp_med', 'hi'),
  dark: Store.get('mp_dark', '1') === '1',
  chapter: 1
};

function applyTheme() { document.body.classList.toggle('light', !state.dark); }
function toggleTheme() { state.dark = !state.dark; Store.set('mp_dark', state.dark ? '1' : '0'); applyTheme(); }
function setMedium(m) { 
  state.med = m; 
  Store.set('mp_med', m); 
  document.getElementById('btnHi').classList.toggle('active', m==='hi'); 
  document.getElementById('btnEn').classList.toggle('active', m==='en'); 
  render(); 
}

const chapters = [
  {
    id: 1,
    titleHi: "अध्याय 1: आकृतियाँ और स्थान (Shapes and Space)",
    titleEn: "Chapter 1: Shapes and Space",
    qs: [
      {
        qHi: "प्रश्न 1: अंदर और बाहर (Inside-Outside): एक ऊँट और एक अरब की कहानी में ऊँट कहाँ बैठना चाहता है?",
        qEn: "Q1: Inside-Outside: In the story of the Arab and his camel, where does the camel want to sit?",
        sHi: "उत्तर: ऊँट पहले तंबू के <span class='math'>बाहर</span> था और ठंडी हवा से बचने के लिए तंबू के <span class='math'>अंदर</span> आना चाहता था।",
        sEn: "Ans: The camel was <span class='math'>outside</span> the tent and wanted to come <span class='math'>inside</span> the tent to escape the cold wind."
      },
      {
        qHi: "प्रश्न 2: बड़ा और छोटा (Bigger and Smaller): एक ही तरह की दो वस्तुओं में से बड़े पर सही (✔) और छोटे पर गलत (✖) का निशान लगाएँ।",
        qEn: "Q2: Bigger and Smaller: Tick (✔) the bigger object and cross (✖) the smaller one.",
        sHi: "उत्तर: आकार में जो वस्तु क्षेत्रफल या लंबाई में अधिक बड़ी है, वह <span class='math'>बड़ी (Bigger)</span> है तथा दूसरी <span class='math'>छोटी (Smaller)</span> है।",
        sEn: "Ans: The object with larger dimensions is <span class='math'>Bigger</span> and the other is <span class='math'>Smaller</span>."
      },
      {
        qHi: "प्रश्न 3: सबसे बड़ा और सबसे छोटा (Biggest and Smallest): तीन तरबूजों या गेंदों के समूह में सबसे बड़े और सबसे छोटे की पहचान करें।",
        qEn: "Q3: Biggest and Smallest: Identify the biggest and smallest among a group of three objects.",
        sHi: "उत्तर: तुलना करने पर जो आकार में सबसे अधिक विशाल है वह <span class='math'>सबसे बड़ा (Biggest)</span> है और जो सबसे सूक्ष्म है वह <span class='math'>सबसे छोटा (Smallest)</span> है।",
        sEn: "Ans: Upon comparison, the largest in size is the <span class='math'>Biggest</span> and the least in size is the <span class='math'>Smallest</span>."
      }
    ]
  },
  {
    id: 2,
    titleHi: "अध्याय 2: एक से नौ तक की संख्याएँ (Numbers from One to Nine)",
    titleEn: "Chapter 2: Numbers from One to Nine",
    qs: [
      {
        qHi: "प्रश्न 1: गिनती करें और सही संख्या लिखें: एक बिल्ली, दो बिल्लियाँ, तीन बिल्लियाँ...",
        qEn: "Q1: Count and write the correct number: one cat, two cats, three cats...",
        sHi: "उत्तर: चित्रों की कुल संख्या गिनकर अंकों में लिखें जैसे — <span class='math'>1, 2, 3, 4, 5, 6, 7, 8, 9</span>।",
        sEn: "Ans: Count the total objects and write numerals like — <span class='math'>1, 2, 3, 4, 5, 6, 7, 8, 9</span>."
      },
      {
        qHi: "प्रश्न 2: जोड़ (Addition): यदि 2 आमों में 3 आम और मिला दिए जाएँ, तो कुल कितने आम होंगे?",
        qEn: "Q2: Addition: If 3 mangoes are added to 2 mangoes, how many total mangoes will there be?",
        sHi: "उत्तर: कुल आमों की संख्या = 2 + 3 = <span class='math'>5 आम</span>।",
        sEn: "Ans: Total mangoes = 2 + 3 = <span class='math'>5 mangoes</span>."
      },
      {
        qHi: "प्रश्न 3: घटाव (Subtraction): 4 चिड़ियाँ पेड़ पर बैठी थीं, 2 उड़ गईं। अब कितनी बचीं?",
        qEn: "Q3: Subtraction: 4 birds were sitting on a tree, 2 flew away. How many are left?",
        sHi: "उत्तर: शेष बची चिड़ियाँ = 4 - 2 = <span class='math'>2 चिड़ियाँ</span>।",
        sEn: "Ans: Remaining birds = 4 - 2 = <span class='math'>2 birds</span>."
      }
    ]
  },
  {
    id: 3,
    titleHi: "अध्याय 3: जोड़ (Addition)",
    titleEn: "Chapter 3: Addition",
    qs: [
      {
        qHi: "प्रश्न 1: कुल कितनी वस्तुएँ हैं? 3 गेंदें + 4 गेंदें = ?",
        qEn: "Q1: How many total objects? 3 balls + 4 balls = ?",
        sHi: "उत्तर: 3 और 4 को जोड़ने पर कुल <span class='math'>7 गेंदें</span> होती हैं।",
        sEn: "Ans: Adding 3 and 4 gives a total of <span class='math'>7 balls</span>."
      },
      {
        qHi: "प्रश्न 2: राहुल के पास 5 टॉफियाँ थीं, उसकी बहन ने उसे 4 टॉफियाँ और दीं। अब राहुल के पास कुल कितनी टॉफियाँ हैं?",
        qEn: "Q2: Rahul had 5 toffees, his sister gave him 4 more. How many total toffees does Rahul have now?",
        sHi: "उत्तर: कुल टॉफियाँ = 5 + 4 = <span class='math'>9 टॉफियाँ</span>।",
        sEn: "Ans: Total toffees = 5 + 4 = <span class='math'>9 toffees</span>."
      }
    ]
  }
];

function render() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = `<span class="crumb-link" onclick="state.chapter=1; render();">Class 1 Math (Math Magic)</span> › <span>Chapter ${state.chapter} Exercises & Solutions</span>`;

  const app = document.getElementById('app');
  let html = `
    <div class="card" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
      ${chapters.map(ch => `
        <button class="btn" style="background:${state.chapter===ch.id?'var(--primary)':'var(--sub-bg)'}; border:1px solid var(--border); color:${state.chapter===ch.id?'#fff':'var(--text)'}; padding:8px 14px; border-radius:8px; font-weight:800; cursor:pointer;" onclick="state.chapter=${ch.id}; render();">
          ${state.med==='hi'?ch.titleHi:ch.titleEn}
        </button>
      `).join('')}
    </div>
  `;

  const curr = chapters.find(c => c.id === state.chapter);
  html += `
    <div class="card">
      <h2 class="section-heading">📚 ${state.med==='hi'?curr.titleHi:curr.titleEn} - Exercises & Master Solutions</h2>
  `;

  curr.qs.forEach((item, idx) => {
    html += `
      <div class="q-box">
        <div class="question">${state.med==='hi'?item.qHi:item.qEn}</div>
        <div class="solution"><strong>${state.med==='hi'?'उत्तर / Solution:':'Answer / Solution:'}</strong><br>${state.med==='hi'?item.sHi:item.sEn}</div>
      </div>
    `;
  });

  html += `</div>`;
  app.innerHTML = html;
}

applyTheme();
render();
</script>
</body>
</html>
