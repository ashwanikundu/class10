<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Class 10 Master Portal • Module 12 (Interactive Quick Revision & Flashcards Hub)</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #070b14;
    --card: #111827;
    --card-hover: #1f2937;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --sub-bg: #0f172a;
    --sol-bg: #064e3b;
    --sol-border: #059669;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --sub-bg: #f8fafc;
    --sol-bg: #ecfdf5;
    --sol-border: #6ee7b7;
    --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
    color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand-title { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.3px; }
  .brand-sub { font-size: 0.78rem; color: #cbd5e1; margin: 0; }
  
  .top-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .medium-switch { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 999px; }
  .med-btn {
    padding: 6px 14px; border-radius: 999px; border: none;
    background: transparent; color: #cbd5e1; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .med-btn.active { background: #fbbf24; color: #0f172a; font-weight: 900; box-shadow: 0 2px 8px rgba(251,191,36,0.4); }
  
  .theme-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  .breadcrumb {
    background: var(--card); color: var(--text); padding: 10px 16px; border-radius: 12px;
    margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; display: flex; gap: 8px; align-items: center;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  
  .card {
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #ec4899, #3b82f6); }
  
  .btn {
    background: linear-gradient(135deg, #ec4899, #be185d); color: #fff; border: none;
    padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem;
  }
  
  .flashcard {
    background: var(--sub-bg); border: 2px dashed var(--primary); padding: 30px 20px; border-radius: 14px;
    text-align: center; cursor: pointer; margin-top: 12px; min-height: 160px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: all 0.2s;
  }
  .flashcard:hover { border-color: #fbbf24; background: rgba(79,70,229,0.08); }

  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand-row">
      <div>
        <h1 class="brand-title">Class 10 Master Portal (CBSE & HBSE)</h1>
        <p class="brand-sub">Module 12: Interactive Quick Revision & Flashcards Hub</p>
      </div>
      <div class="top-controls">
        <div class="medium-switch">
          <button class="med-btn active" id="btnEn" onclick="setMedium('en')">English + Meanings</button>
          <button class="med-btn" id="btnHi" onclick="setMedium('hi')">Hindi Medium</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="app"></div>
</div>

<footer>
  Class 10 Master Portal • Module 12 (Flashcards Hub) • Zero Data Loss Engine
</footer>

<script>
const SafeStore = {
  get(k, f) { try { const v = localStorage.getItem(k); return v !== null ? v : f; } catch(e){ return f; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
};

let state = {
  medium: SafeStore.get('mp_med', 'en'),
  isDark: SafeStore.get('mp_dark', '1') === '1',
  cardIndex: 0,
  showAnswer: false
};

const FLASHCARDS = [
  {
    termEn: "Fundamental Theorem of Arithmetic",
    termHi: "अंकगणित की आधारभूत प्रमेय",
    defEn: "Every composite number can be expressed as a product of primes, and this factorization is unique.",
    defHi: "प्रत्येक भाज्य संख्या को अभाज्य संख्याओं के गुणनफल के रूप में व्यक्त किया जा सकता है और यह गुणनखंड अद्वितीय होता है।"
  },
  {
    termEn: "Ohm's Law",
    termHi: "ओह्म का नियम",
    defEn: "At constant temperature, current flowing through a conductor is directly proportional to potential difference across its ends (V = IR).",
    defHi: "नियत ताप पर चालक में बहने वाली धारा उसके सिरों के विभवांतर के समानुपाती होती है (V = IR)।"
  },
  {
    termEn: "Thales Theorem (BPT)",
    termHi: "थेल्स प्रमेय (आधारभूत आनुपातिकता प्रमेय)",
    defEn: "If a line is drawn parallel to one side of a triangle to intersect other two sides, it divides them in the same ratio.",
    defHi: "यदि किसी त्रिभुज की एक भुजा के समांतर रेखा खींची जाए, तो वह अन्य दो भुजाओं को समान अनुपात में विभाजित करती है।"
  },
  {
    termEn: "Refractive Index",
    termHi: "अपवर्तनांक",
    defEn: "The ratio of speed of light in vacuum to speed of light in the given medium (n = c/v).",
    defHi: "निर्वात में प्रकाश की चाल और माध्यम में प्रकाश की चाल का अनुपात (n = c/v)।"
  }
];

function applyTheme() {
  document.body.classList.toggle('light', !state.isDark);
}
function toggleTheme() {
  state.isDark = !state.isDark;
  SafeStore.set('mp_dark', state.isDark ? '1' : '0');
  applyTheme();
}

function setMedium(m) {
  state.medium = m;
  SafeStore.set('mp_med', m);
  document.getElementById('btnEn').classList.toggle('active', m === 'en');
  document.getElementById('btnHi').classList.toggle('active', m === 'hi');
  render();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = `<span>🏠 All Utilities • Module 12 (Interactive Flashcards Hub)</span>`;
}

function render() {
  renderBreadcrumb();
  const app = document.getElementById('app');

  const card = FLASHCARDS[state.cardIndex];

  app.innerHTML = `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:0.78rem; font-weight:700; color:var(--muted);">Flashcard ${state.cardIndex + 1} of ${FLASHCARDS.length}</span>
        <span style="font-size:0.78rem; font-weight:700; color:#fbbf24;">💡 Tap card to flip</span>
      </div>
      
      <div class="flashcard" onclick="state.showAnswer=!state.showAnswer; render();">
        ${!state.showAnswer ? `
          <div style="font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">Concept / Term</div>
          <div style="font-size:1.2rem; font-weight:900; color:var(--text);">${state.medium === 'hi' ? card.termHi : card.termEn}</div>
        ` : `
          <div style="font-size:0.75rem; color:#34d399; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">Definition / Statement</div>
          <div style="font-size:1.05rem; font-weight:700; color:#34d399; line-height:1.5;">${state.medium === 'hi' ? card.defHi : card.defEn}</div>
        `}
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:16px;">
        <button class="btn" onclick="prevCard()">← Previous</button>
        <button class="btn" onclick="nextCard()">Next →</button>
      </div>
    </div>
  `;
}

function nextCard() {
  state.cardIndex = (state.cardIndex + 1) % FLASHCARDS.length;
  state.showAnswer = false;
  render();
}

function prevCard() {
  state.cardIndex = (state.cardIndex - 1 + FLASHCARDS.length) % FLASHCARDS.length;
  state.showAnswer = false;
  render();
}

applyTheme();
render();
</script>
</body>
</html>
